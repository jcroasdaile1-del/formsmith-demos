    async function saveGuardianForm(form) {
      if (!requireTrimmed(form, ['firstName', 'lastName', 'relationship']) || !form.reportValidity()) return;
      const values = formValues(form);
      const student = studentById(values.studentId);
      if (!student) return toast('Student not found', 'No guardian relationship was changed.', 'error');
      const email = String(values.email || '').trim();
      const phone = String(values.phone || '').trim();
      if (!email && !phone) {
        form.elements.email.setCustomValidity('Add an email or phone number.');
        form.elements.email.reportValidity();
        return;
      }
      const contactMatches = state.data.guardians.filter((guardian) => (
        (email && String(guardian.email || '').trim().toLowerCase() === email.toLowerCase())
        || (phone && normalizePhone(guardian.phone) === normalizePhone(phone))
      ));
      if (new Set(contactMatches.map((guardian) => guardian.id)).size > 1) {
        form.elements.email.setCustomValidity('That email and phone belong to different guardian records. Use one existing contact or a new combination.');
        form.elements.email.reportValidity();
        return;
      }
      const now = timestamp();
      const currentLink = values.linkId ? state.data.studentGuardians.find((item) => item.id === values.linkId && item.studentId === student.id) : null;
      const currentGuardian = currentLink ? state.data.guardians.find((item) => item.id === currentLink.guardianId) : null;
      let guardian = contactMatches[0] || currentGuardian;
      const reused = Boolean(contactMatches[0] && contactMatches[0].id !== currentGuardian?.id);
      if (!guardian) {
        guardian = { id: makeId('gua'), familyKey: student.lastName.toLowerCase(), createdAt: now };
        state.data.guardians.push(guardian);
      }
      Object.assign(guardian, {
        firstName: values.firstName.trim(),
        lastName: values.lastName.trim(),
        email: reused ? (email || guardian.email || '') : email,
        phone: reused ? (phone || guardian.phone || '') : phone,
        preferredContact: values.preferredContact,
        notes: String(values.guardianNotes || '').trim(),
        updatedAt: now
      });
      const duplicateLink = state.data.studentGuardians.find((item) => item.studentId === student.id && item.guardianId === guardian.id && item.id !== currentLink?.id);
      let link = duplicateLink || currentLink;
      if (!link) {
        link = { id: makeId('sg'), studentId: student.id, guardianId: guardian.id, createdAt: now };
        state.data.studentGuardians.push(link);
      } else {
        link.guardianId = guardian.id;
      }
      if (duplicateLink && currentLink) {
        state.data.studentGuardians = state.data.studentGuardians.filter((item) => item.id !== currentLink.id);
      }
      const wantsPrimary = values.primaryContact === 'yes';
      const wantsBilling = values.billingContact === 'yes';
      if (wantsPrimary) state.data.studentGuardians.filter((item) => item.studentId === student.id && item.id !== link.id).forEach((item) => { item.primaryContact = false; item.updatedAt = now; });
      if (wantsBilling) state.data.studentGuardians.filter((item) => item.studentId === student.id && item.id !== link.id).forEach((item) => { item.billingContact = false; item.updatedAt = now; });
      Object.assign(link, {
        relationship: values.relationship,
        primaryContact: wantsPrimary,
        billingContact: wantsBilling,
        notes: String(values.relationshipNotes || '').trim(),
        updatedAt: now
      });
      const studentLinks = state.data.studentGuardians.filter((item) => item.studentId === student.id);
      if (!studentLinks.some((item) => item.primaryContact)) link.primaryContact = true;
      if (!studentLinks.some((item) => item.billingContact)) {
        const primary = studentLinks.find((item) => item.primaryContact) || link;
        primary.billingContact = true;
        primary.updatedAt = now;
      }
      logActivity(`${currentLink ? 'Updated' : 'Connected'} guardian ${guardian.firstName} ${guardian.lastName} for ${studentName(student)}.`, 'student', `#students/${student.id}`);
      if (!await persist(['guardians', 'studentGuardians', 'activity'], currentLink ? 'Guardian relationship updated' : reused ? 'Shared guardian connected' : 'Guardian connected', reused ? 'The existing family contact is now shared with this student.' : 'Contact and relationship details were saved.')) return;
      closeModal(false);
      state.studentTab = 'guardians';
      showStudentProfile(student.id);
    }

    async function unlinkGuardian(linkId) {
      const link = state.data.studentGuardians.find((item) => item.id === linkId);
      if (!link) return;
      const student = studentById(link.studentId);
      if (!student) return;
      const links = state.data.studentGuardians.filter((item) => item.studentId === student.id);
      if (student.studentType === 'Minor' && links.length <= 1) {
        toast('A minor must keep a guardian', 'Add another guardian before unlinking this relationship.', 'error');
        return;
      }
      const guardian = state.data.guardians.find((item) => item.id === link.guardianId);
      const okay = await confirmAction('Unlink this guardian?', `${guardian ? `${guardian.firstName} ${guardian.lastName}` : 'This contact'} will be removed from ${studentName(student)} only. Shared sibling contacts and history remain intact.`, 'Unlink guardian', 'danger');
      if (!okay) return;
      state.data.studentGuardians = state.data.studentGuardians.filter((item) => item.id !== link.id);
      const remaining = state.data.studentGuardians.filter((item) => item.studentId === student.id);
      const now = timestamp();
      if (remaining.length && !remaining.some((item) => item.primaryContact)) {
        remaining[0].primaryContact = true;
        remaining[0].updatedAt = now;
      }
      if (remaining.length && !remaining.some((item) => item.billingContact)) {
        (remaining.find((item) => item.primaryContact) || remaining[0]).billingContact = true;
      }
      logActivity(`Unlinked guardian ${guardian ? `${guardian.firstName} ${guardian.lastName}` : ''} from ${studentName(student)}.`, 'student', `#students/${student.id}`);
      if (!await persist(['studentGuardians', 'activity'], 'Guardian unlinked', 'The contact remains available for linked siblings and historical records.')) return;
      state.studentTab = 'guardians';
      showStudentProfile(student.id);
    }

    async function saveStudentForm(form) {
      if (!requireTrimmed(form, ['firstName', 'lastName', 'startDate', 'level', 'scheduleDay', 'scheduleTime', 'duration', 'tuitionAmount'])) return;
      const values = formValues(form);
      const existing = values.id ? studentById(values.id) : null;
      const firstName = values.firstName.trim();
      const lastName = values.lastName.trim();
      const duplicate = state.data.students.find((student) => student.id !== values.id && student.firstName.toLowerCase() === firstName.toLowerCase() && student.lastName.toLowerCase() === lastName.toLowerCase() && (!values.birthDate || student.birthDate === values.birthDate));
      if (duplicate) {
        form.elements.firstName.setCustomValidity('A matching student already exists.');
        form.elements.firstName.reportValidity();
        return;
      }
      const tuitionAmount = positiveNumber(values.tuitionAmount);
      if (!tuitionAmount) {
        form.elements.tuitionAmount.setCustomValidity('Enter a positive tuition amount.');
        form.elements.tuitionAmount.reportValidity();
        return;
      }
      const adult = values.studentType === 'Adult';
      if (adult && !String(values.email || '').trim() && !String(values.phone || '').trim()) {
        form.elements.email.setCustomValidity('Add an email or phone number for an adult student.');
        form.elements.email.reportValidity();
        return;
      }
      if (!adult && (!String(values.guardianFirstName || '').trim() || !String(values.guardianLastName || '').trim() || (!String(values.guardianEmail || '').trim() && !String(values.guardianPhone || '').trim()))) {
        form.elements.guardianFirstName.setCustomValidity('Minor students need a guardian name and an email or phone number.');
        form.elements.guardianFirstName.reportValidity();
        return;
      }
      let guardianEditContext = null;
      if (!adult) {
        const email = String(values.guardianEmail || '').trim();
        const phone = String(values.guardianPhone || '').trim();
        const previousPrimaryLink = existing
          ? state.data.studentGuardians.find((item) => item.studentId === existing.id && item.primaryContact)
            || state.data.studentGuardians.find((item) => item.studentId === existing.id)
          : null;
        const previousPrimaryGuardian = previousPrimaryLink
          ? state.data.guardians.find((item) => item.id === previousPrimaryLink.guardianId)
          : null;
        const sharedElsewhere = Boolean(previousPrimaryGuardian && state.data.studentGuardians.some((item) => (
          item.guardianId === previousPrimaryGuardian.id && item.studentId !== existing?.id
        )));
        const contactChanged = Boolean(previousPrimaryGuardian && (
          email.toLowerCase() !== String(previousPrimaryGuardian.email || '').trim().toLowerCase()
          || normalizePhone(phone) !== normalizePhone(previousPrimaryGuardian.phone)
        ));
        const sharedProfileChanged = Boolean(previousPrimaryGuardian && sharedElsewhere && !contactChanged && (
          values.guardianFirstName.trim() !== previousPrimaryGuardian.firstName
          || values.guardianLastName.trim() !== previousPrimaryGuardian.lastName
          || values.guardianContact !== previousPrimaryGuardian.preferredContact
          || String(values.guardianNotes || '').trim() !== String(previousPrimaryGuardian.notes || '').trim()
        ));
        if (sharedProfileChanged) {
          form.elements.guardianEmail.setCustomValidity('This guardian is shared with another student. Update shared contact details from the Guardians tab, or enter a new email or phone to connect a different guardian here.');
          form.elements.guardianEmail.reportValidity();
          return;
        }
        guardianEditContext = {
          email,
          phone,
          previousPrimaryLink,
          previousPrimaryGuardian,
          sharedElsewhere,
          contactChanged
        };
      }
      if (values.status === 'Active') {
        const proposedStart = minutesFromTime(values.scheduleTime);
        const proposedEnd = proposedStart + Number(values.duration);
        const overlap = state.data.recurringSchedules.find((schedule) => {
          if (schedule.active === false || schedule.studentId === existing?.id || schedule.day !== values.scheduleDay) return false;
          const otherStart = minutesFromTime(schedule.startTime);
          return proposedStart < otherStart + Number(schedule.duration) && proposedEnd > otherStart;
        });
        if (overlap) {
          form.elements.scheduleTime.setCustomValidity(`${studentName(overlap.studentId)} already has a recurring lesson at ${formatTime(overlap.startTime)} on ${overlap.day}.`);
          form.elements.scheduleTime.reportValidity();
          return;
        }
      }
      const now = timestamp();
      const studentId = existing?.id || makeId('stu');
      const nextStudent = {
        ...(existing || {}),
        id: studentId,
        firstName,
        lastName,
        preferredName: String(values.preferredName || '').trim(),
        birthDate: values.birthDate || '',
        studentType: values.studentType,
        status: values.status,
        startDate: values.startDate,
        inactiveDate: values.status === 'Inactive' ? (existing?.inactiveDate || localIso()) : '',
        level: values.level,
        yearsStudying: Number(values.yearsStudying || 0),
        goals: String(values.goals || '').trim(),
        learningNotes: String(values.learningNotes || '').trim(),
        techniqueFocus: String(values.techniqueFocus || '').trim(),
        teacherNotes: String(values.teacherNotes || '').trim(),
        email: adult ? String(values.email || '').trim() : '',
        phone: adult ? String(values.phone || '').trim() : '',
        preferredContact: adult ? values.preferredContact : '',
        tuitionAmount,
        billingModel: 'Monthly tuition',
        location: values.location,
        createdAt: existing?.createdAt || now,
        updatedAt: now
      };
      if (existing) Object.assign(existing, nextStudent);
      else state.data.students.push(nextStudent);

      const changedCollections = ['students', 'activity'];
      if (!adult) {
        const { email, phone, previousPrimaryLink, previousPrimaryGuardian, sharedElsewhere, contactChanged } = guardianEditContext;
        let guardian = sharedElsewhere && contactChanged
          ? guardianByContact(email, phone, previousPrimaryGuardian.id)
          : guardianByContact(email, phone);
        const reusingSharedGuardian = Boolean(guardian && guardian.id !== previousPrimaryGuardian?.id);
        if (!guardian && existing && previousPrimaryGuardian && !(sharedElsewhere && contactChanged)) guardian = previousPrimaryGuardian;
        if (!guardian) {
          guardian = {
            id: makeId('gua'),
            familyKey: lastName.toLowerCase(),
            firstName: values.guardianFirstName.trim(),
            lastName: values.guardianLastName.trim(),
            email,
            phone,
            preferredContact: values.guardianContact,
            notes: String(values.guardianNotes || '').trim(),
            createdAt: now,
            updatedAt: now
          };
          state.data.guardians.push(guardian);
        } else {
          Object.assign(guardian, {
            firstName: values.guardianFirstName.trim(),
            lastName: values.guardianLastName.trim(),
            email: reusingSharedGuardian ? (email || guardian.email || '') : email,
            phone: reusingSharedGuardian ? (phone || guardian.phone || '') : phone,
            preferredContact: values.guardianContact,
            notes: reusingSharedGuardian ? (String(values.guardianNotes || '').trim() || guardian.notes || '') : String(values.guardianNotes || '').trim(),
            updatedAt: now
          });
        }
        state.data.studentGuardians.filter((item) => item.studentId === studentId).forEach((item) => {
          item.primaryContact = false;
        });
        let link = state.data.studentGuardians.find((item) => item.studentId === studentId && item.guardianId === guardian.id);
        if (!link && previousPrimaryLink) {
          link = previousPrimaryLink;
          link.guardianId = guardian.id;
        }
        if (!link) {
          const hasBillingContact = state.data.studentGuardians.some((item) => item.studentId === studentId && item.billingContact);
          state.data.studentGuardians.push({ id: makeId('sg'), studentId, guardianId: guardian.id, relationship: values.guardianRelationship, primaryContact: true, billingContact: !hasBillingContact, notes: String(values.guardianRelationshipNotes || '').trim(), createdAt: now, updatedAt: now });
        } else {
          link.relationship = values.guardianRelationship;
          link.primaryContact = true;
          link.notes = String(values.guardianRelationshipNotes || '').trim();
          link.updatedAt = now;
        }
        changedCollections.push('guardians', 'studentGuardians');
      }

      const activeSchedule = scheduleForStudent(studentId);
      const scheduleChanged = !activeSchedule || activeSchedule.day !== values.scheduleDay || activeSchedule.startTime !== values.scheduleTime || Number(activeSchedule.duration) !== Number(values.duration);
      if (values.status === 'Active') {
        if (scheduleChanged) {
          if (activeSchedule) {
            activeSchedule.active = false;
            activeSchedule.effectiveTo = addDays(-1);
            activeSchedule.updatedAt = now;
            state.data.lessons.filter((lesson) => lesson.sourceScheduleId === activeSchedule.id && lesson.date >= localIso() && lesson.status === 'Scheduled').forEach((lesson) => {
              lesson.status = 'Rescheduled';
              lesson.cancellationReason = 'Recurring lesson time changed; replacement occurrence generated from the new slot.';
              lesson.updatedAt = now;
            });
          }
          state.data.recurringSchedules.push({
            id: makeId('sch'),
            studentId,
            day: values.scheduleDay,
            startTime: values.scheduleTime,
            duration: Number(values.duration),
            location: values.location,
            active: true,
            effectiveFrom: existing ? localIso() : values.startDate,
            effectiveTo: '',
            createdAt: now,
            updatedAt: now
          });
          ensureLessonOccurrences();
          changedCollections.push('recurringSchedules', 'lessons');
        } else {
          activeSchedule.location = values.location;
          activeSchedule.updatedAt = now;
          changedCollections.push('recurringSchedules');
        }
      } else if (activeSchedule) {
        activeSchedule.active = false;
        activeSchedule.effectiveTo = localIso();
        activeSchedule.updatedAt = now;
        state.data.lessons.filter((lesson) => lesson.sourceScheduleId === activeSchedule.id && lesson.date > localIso() && lesson.status === 'Scheduled').forEach((lesson) => {
          lesson.status = 'Student Cancelled';
          lesson.cancellationReason = 'Student is no longer active; future occurrence retained as cancelled history.';
          lesson.updatedAt = now;
        });
        changedCollections.push('recurringSchedules', 'lessons');
      }

      if (!existing && values.status === 'Active') {
        const period = values.startDate.slice(0, 7);
        state.data.tuitionCharges.push({
          id: makeId('chg'),
          studentId,
          period,
          dueDate: values.startDate,
          amount: tuitionAmount,
          description: `${monthLabel(period)} monthly tuition`,
          notes: 'Created with new student enrollment.',
          status: 'Posted',
          voidedAt: '',
          voidReason: '',
          createdAt: now,
          updatedAt: now
        });
        changedCollections.push('tuitionCharges');
      }
      logActivity(`${existing ? 'Updated' : 'Added'} student ${studentName(nextStudent)}.`, 'student', `#students/${studentId}`);
      if (!await persist(changedCollections, existing ? 'Student updated' : 'Student created', existing ? 'Historical lessons and payments were preserved.' : 'Recurring lessons and tuition are ready.')) return;
      closeModal(false);
      state.routeId = studentId;
      render();
      requestAnimationFrame(() => showStudentProfile(studentId));
    }

    function minutesFromTime(time) {
      const [hour, minute] = String(time || '00:00').split(':').map(Number);
      return hour * 60 + minute;
    }

    function timeFromMinutes(total) {
      const bounded = Math.max(0, Math.min(1439, Number(total || 0)));
      return `${String(Math.floor(bounded / 60)).padStart(2, '0')}:${String(bounded % 60).padStart(2, '0')}`;
    }

    function firstAvailableRecurringTime(day, duration = 45, excludeStudentId = '') {
      const opening = minutesFromTime(state.data.settings.openTime || '10:00');
      const closing = minutesFromTime(state.data.settings.closeTime || '19:30');
      for (let start = opening; start + Number(duration) <= closing; start += 15) {
        const overlaps = state.data.recurringSchedules.some((schedule) => {
          if (schedule.active === false || schedule.studentId === excludeStudentId || schedule.day !== day) return false;
          const otherStart = minutesFromTime(schedule.startTime);
          return start < otherStart + Number(schedule.duration) && start + Number(duration) > otherStart;
        });
        if (!overlaps) return timeFromMinutes(start);
      }
      return state.data.settings.openTime || '10:00';
    }

    function lessonConflicts(candidate, excludeId = '') {
      const start = minutesFromTime(candidate.startTime);
      const end = start + Number(candidate.duration || 0);
      const closure = (state.data.settings.studioClosures || []).find((item) => item.date === candidate.date);
      const lessons = state.data.lessons.filter((lesson) => lesson.id !== excludeId && lesson.date === candidate.date && !['Student Cancelled', 'Teacher Cancelled', 'No Show', 'Rescheduled'].includes(lesson.status)).filter((lesson) => {
        const otherStart = minutesFromTime(lesson.startTime);
        const otherEnd = otherStart + Number(lesson.duration || 0);
        return start < otherEnd && end > otherStart;
      });
      return { closure, lessons };
    }

    function firstAvailableLessonTime(date, duration = 45, excludeLessonId = '') {
      const opening = minutesFromTime(state.data.settings.openTime || '10:00');
      const closing = minutesFromTime(state.data.settings.closeTime || '19:30');
      for (let start = opening; start + Number(duration) <= closing; start += 15) {
        const candidate = { date, startTime: timeFromMinutes(start), duration };
        if (!lessonConflicts(candidate, excludeLessonId).lessons.length) return candidate.startTime;
      }
      return state.data.settings.openTime || '10:00';
    }

    async function saveLessonForm(form) {
      if (!requireTrimmed(form, ['type', 'status', 'date', 'startTime', 'duration', 'location'])) return;
      const values = formValues(form);
      const existing = values.id ? state.data.lessons.find((lesson) => lesson.id === values.id) : null;
      if (existing?.status === 'Completed') return toast('Completed lessons are read-only', 'The permanent teaching record was not changed.', 'error');
      if (values.status === 'Completed') return toast('Use the lesson workspace to complete a lesson', 'Completion requires teaching notes and practice assignments.', 'error');
      if (!existing && values.type === 'Makeup') return toast('Schedule makeups from a credit', 'Open Billing → Makeups and choose an owed credit.', 'error');
      if (values.type === 'Trial' && !values.inquiryId) {
        form.elements.inquiryId.setCustomValidity('Select the inquiry for this trial lesson.');
        form.elements.inquiryId.reportValidity();
        return;
      }
      if (values.type !== 'Trial' && !values.studentId) {
        form.elements.studentId.setCustomValidity('Select a student.');
        form.elements.studentId.reportValidity();
        return;
      }
      if (['Student Cancelled', 'Teacher Cancelled', 'No Show', 'Rescheduled'].includes(values.status) && !String(values.cancellationReason || '').trim()) {
        form.elements.cancellationReason.setCustomValidity('Add a short reason so the history remains clear.');
        form.elements.cancellationReason.reportValidity();
        return;
      }
      const candidate = { date: values.date, startTime: values.startTime, duration: Number(values.duration) };
      const conflicts = lessonConflicts(candidate, existing?.id);
      if ((conflicts.closure || conflicts.lessons.length) && values.allowConflict !== 'yes') {
        const detail = conflicts.closure ? conflicts.closure.name : `${lessonDisplayName(conflicts.lessons[0])} at ${formatTime(conflicts.lessons[0].startTime)}`;
        form.elements.startTime.setCustomValidity(`This overlaps ${detail}. Check the override box if the overlap is intentional.`);
        form.elements.startTime.reportValidity();
        return;
      }
      const now = timestamp();
      const record = {
        id: existing?.id || makeId('les'),
        studentId: values.type === 'Trial' ? '' : values.studentId,
        inquiryId: values.type === 'Trial' ? values.inquiryId : '',
        sourceScheduleId: existing?.sourceScheduleId || '',
        date: values.date,
        startTime: values.startTime,
        duration: Number(values.duration),
        type: values.type,
        status: values.status,
        rescheduledFromId: existing?.rescheduledFromId || '',
        cancellationReason: String(values.cancellationReason || '').trim(),
        location: values.location,
        summary: existing?.summary || '',
        whatWentWell: existing?.whatWentWell || '',
        focusNext: existing?.focusNext || '',
        technique: existing?.technique || [],
        techniqueNotes: existing?.techniqueNotes || '',
        repertoireProgress: existing?.repertoireProgress || [],
        completedAt: values.status === 'Completed' ? (existing?.completedAt || now) : '',
        createdAt: existing?.createdAt || now,
        updatedAt: now
      };
      let savedRecord = record;
      const changedCollections = ['lessons', 'inquiries', 'activity'];
      if (existing && (existing.date !== record.date || existing.startTime !== record.startTime)) {
        existing.status = 'Rescheduled';
        existing.cancellationReason = `Moved to ${formatDate(record.date)} at ${formatTime(record.startTime)}.`;
        existing.updatedAt = now;
        savedRecord = { ...record, id: makeId('les'), sourceScheduleId: '', status: 'Scheduled', rescheduledFromId: existing.id, createdAt: now };
        state.data.lessons.push(savedRecord);
        const makeupCredit = state.data.makeupCredits.find((credit) => credit.scheduledLessonId === existing.id);
        if (makeupCredit) {
          makeupCredit.status = 'Scheduled';
          makeupCredit.scheduledLessonId = savedRecord.id;
          makeupCredit.updatedAt = now;
          changedCollections.push('makeupCredits');
        }
      } else if (existing) {
        Object.assign(existing, record);
      } else {
        state.data.lessons.push(record);
      }
      if (savedRecord.type === 'Makeup' && ['Student Cancelled', 'Teacher Cancelled', 'No Show'].includes(savedRecord.status)) {
        const makeupCredit = state.data.makeupCredits.find((credit) => credit.scheduledLessonId === savedRecord.id);
        if (makeupCredit) {
          makeupCredit.status = 'Owed';
          makeupCredit.scheduledLessonId = '';
          makeupCredit.notes = `${makeupCredit.notes ? `${makeupCredit.notes}\n` : ''}${formatDate(localIso())}: Scheduled makeup was cancelled and returned to owed.`;
          makeupCredit.updatedAt = now;
          changedCollections.push('makeupCredits');
        }
      }
      if (savedRecord.inquiryId) {
        const inquiry = state.data.inquiries.find((item) => item.id === savedRecord.inquiryId);
        if (inquiry) {
          inquiry.trialLessonId = savedRecord.id;
          inquiry.status = savedRecord.status === 'Completed' ? 'Trial Completed' : 'Trial Scheduled';
          inquiry.nextFollowUp = savedRecord.status === 'Completed' ? localIso() : addDays(1, parseDate(savedRecord.date));
          inquiry.updatedAt = now;
        }
      }
      logActivity(`${existing ? 'Updated' : 'Scheduled'} ${savedRecord.type.toLowerCase()} lesson for ${lessonDisplayName(savedRecord)}.`, 'lesson', '#schedule');
      if (!await persist(changedCollections, existing && savedRecord.id !== existing.id ? 'Lesson rescheduled' : 'Lesson saved', existing && savedRecord.id !== existing.id ? 'The original occurrence remains in history.' : 'The schedule is up to date.')) return;
      closeModal();
      render();
    }

    async function saveLessonWorkspace(form, intent) {
      const values = formValues(form);
      const lesson = state.data.lessons.find((item) => item.id === values.id);
      if (!lesson) return toast('Lesson not found', '', 'error');
      if (lesson.status === 'Completed') return toast('Completed lessons are read-only', 'The permanent teaching record was not changed.', 'error');
      const completing = intent === 'complete';
      const student = studentById(lesson.studentId);
      const assignmentRows = student ? assignmentRowsFromForm(form) : [];
      if (!completing && values.status === 'Completed') return toast('Use “Complete lesson”', 'A draft cannot bypass the required completion notes and assignments.', 'error');
      if (completing && lesson.date > localIso()) {
        toast('Future lessons cannot be completed yet', `This occurrence is scheduled for ${formatDate(lesson.date)}.`, 'error');
        return;
      }
      if (completing && !String(values.summary || values.whatWentWell || values.focusNext || '').trim()) {
        form.elements.summary.setCustomValidity('Add at least one lesson note before completing the lesson.');
        form.elements.summary.reportValidity();
        return;
      }
      if (completing && student && !assignmentRows.length) {
        const firstInstruction = $('[data-assignment-field="instructions"]', form);
        firstInstruction?.setCustomValidity('Add at least one concrete practice instruction for the next lesson.');
        firstInstruction?.reportValidity();
        return;
      }
      const incompleteAssignment = completing && student ? assignmentRows.find((assignment) => !assignment.instructions) : null;
      if (incompleteAssignment) {
        const instruction = $('[data-assignment-field="instructions"]', incompleteAssignment.element);
        instruction?.setCustomValidity('Each assignment row needs a concrete practice instruction.');
        instruction?.reportValidity();
        return;
      }
      if (['Student Cancelled', 'Teacher Cancelled', 'No Show', 'Rescheduled'].includes(values.status) && !String(values.cancellationReason || '').trim()) {
        form.elements.cancellationReason.setCustomValidity('Add a reason so the attendance history is clear.');
        form.elements.cancellationReason.reportValidity();
        return;
      }
      const now = timestamp();
      lesson.status = completing ? 'Completed' : values.status;
      lesson.cancellationReason = String(values.cancellationReason || '').trim();
      lesson.whatWentWell = String(values.whatWentWell || '').trim();
      lesson.focusNext = String(values.focusNext || '').trim();
      lesson.summary = String(values.summary || '').trim();
      lesson.technique = new FormData(form).getAll('technique');
      lesson.techniqueNotes = String(values.techniqueNotes || '').trim();
      lesson.updatedAt = now;
      if (completing) lesson.completedAt = now;
      const changed = ['lessons', 'activity'];
      const progress = [];
      if (student) {
        studentRepertoire(student.id, true).forEach((piece) => {
          const status = values[`pieceStatus__${piece.id}`] || piece.status;
          const section = String(values[`pieceSection__${piece.id}`] || '').trim();
          const note = String(values[`pieceNote__${piece.id}`] || '').trim();
          progress.push({ repertoireId: piece.id, status, section, note });
          if (lesson.status === 'Completed') {
            piece.status = status;
            piece.lastWorkedOn = lesson.date;
            piece.updatedAt = now;
            if (status === 'Completed' && !piece.dateCompleted) piece.dateCompleted = lesson.date;
          }
        });
        lesson.repertoireProgress = progress;
        if (lesson.status === 'Completed') changed.push('repertoire');
      }
      if (completing && student) {
        state.data.assignments.filter((assignment) => assignment.studentId === student.id && assignment.status === 'Current').forEach((assignment) => {
          assignment.status = 'Previous';
          assignment.updatedAt = now;
        });
        assignmentRows.forEach((assignmentValues) => {
          const assignment = assignmentValues.id ? state.data.assignments.find((item) => item.id === assignmentValues.id && item.lessonId === lesson.id) : null;
          const nextAssignment = {
            id: assignment?.id || makeId('asg'),
            studentId: student.id,
            lessonId: lesson.id,
            repertoireId: assignmentValues.repertoireId,
            dateAssigned: lesson.date,
            section: assignmentValues.section,
            instructions: assignmentValues.instructions,
            targetTempo: assignmentValues.targetTempo,
            practiceGoal: assignmentValues.practiceGoal,
            status: 'Current',
            progressNotes: assignment?.progressNotes || '',
            createdAt: assignment?.createdAt || now,
            updatedAt: now
          };
          if (assignment) Object.assign(assignment, nextAssignment);
          else state.data.assignments.push(nextAssignment);
        });
        changed.push('assignments');
      }
      if (lesson.status === 'Completed' && lesson.type === 'Trial' && lesson.inquiryId) {
        const inquiry = state.data.inquiries.find((item) => item.id === lesson.inquiryId);
        if (inquiry) {
          inquiry.status = 'Trial Completed';
          inquiry.nextFollowUp = localIso();
          inquiry.updatedAt = now;
          changed.push('inquiries');
        }
      }
      if (lesson.type === 'Makeup') {
        const credit = state.data.makeupCredits.find((item) => item.scheduledLessonId === lesson.id);
        if (credit) {
          let creditChanged = false;
          if (lesson.status === 'Completed') {
            credit.status = 'Completed';
            credit.completedDate = lesson.date;
            creditChanged = true;
          } else if (['Student Cancelled', 'Teacher Cancelled', 'No Show', 'Rescheduled'].includes(lesson.status)) {
            credit.status = 'Owed';
            credit.scheduledLessonId = '';
            credit.completedDate = '';
            credit.notes = `${credit.notes ? `${credit.notes}\n` : ''}${formatDate(localIso())}: Scheduled makeup was cancelled and returned to owed.`;
            creditChanged = true;
          }
          if (creditChanged) {
            credit.updatedAt = now;
            changed.push('makeupCredits');
          }
        }
      }
      if (lesson.studentId && values.createMakeupCredit === 'yes' && ['Student Cancelled', 'Teacher Cancelled'].includes(lesson.status) && !state.data.makeupCredits.some((credit) => credit.lessonId === lesson.id && !['Waived', 'Expired'].includes(credit.status))) {

        changed.push('makeupCredits');
      }
      logActivity(`${completing ? 'Completed' : 'Updated'} lesson notes for ${lessonDisplayName(lesson)}.`, 'lesson', `#lessons`);
      if (!await persist(changed, completing ? 'Lesson completed' : 'Lesson notes saved', completing ? 'History, repertoire, assignment, and makeup records are synchronized.' : 'You can return and finish this workspace later.')) return;

      render();

    async function reactivateRepertoire(repertoireId) {
      const source = repertoireById(repertoireId);
      if (!source || source.status !== 'Completed') return toast('Completed piece not found', 'Only a completed repertoire record can be reactivated.', 'error');
      const duplicate = state.data.repertoire.find((item) => item.studentId === source.studentId && item.status !== 'Completed' && item.title.trim().toLowerCase() === source.title.trim().toLowerCase() && item.composer.trim().toLowerCase() === source.composer.trim().toLowerCase());
      if (duplicate) return toast('This piece is already active', `${source.title} already has a current study record for ${studentName(source.studentId)}.`, 'info');
      const okay = await confirmAction('Reactivate this piece?', `A new current study record will be created for ${studentName(source.studentId)}. The completed record and its original dates will remain unchanged.`, 'Reactivate piece', 'primary');
      if (!okay) return;
      if (Repository.mode === 'sheets') {
        setSaveState('saving', 'Reactivating…');
        try {
          const result = await callServer('reactivateRepertoire', repertoireId);
          if (!result?.state) throw new Error('The spreadsheet did not return the reactivated studio state.');
          state.data = normalizeData(result.state);
          state.committedData = clone(state.data);
          setSaveState('saved');
          closeModal(false);
          render();
          toast('Piece reactivated', 'A linked current study record was created; the completion remains immutable.');
        } catch (error) {
          setSaveState('error');
          toast('Could not reactivate piece', error.message || 'No repertoire history was changed.', 'error', 6000);
        }
        return;
      }
      const now = timestamp();
      const successor = {
        id: makeId('rep'),
        studentId: source.studentId,
        title: source.title,
        composer: source.composer,
        collection: source.collection || 'Current study',
        dateAssigned: localIso(),
        status: 'New',
        dateCompleted: '',
        lastWorkedOn: localIso(),
        notes: `${source.notes ? `${source.notes}\n\n` : ''}Reactivated ${formatDate(localIso())} from completed repertoire record.`,
        reactivatedFromId: source.id,
        createdAt: now,
        updatedAt: now
      };
      state.data.repertoire.push(successor);
      logActivity(`Reactivated ${source.title} for ${studentName(source.studentId)} from completed record ${source.id}.`, 'repertoire', '#repertoire');
      if (!await persist(['repertoire', 'activity'], 'Piece reactivated', 'A linked current study record was created; the completion remains immutable.')) return;
      closeModal(false);
      render();
      if (state.routeId === source.studentId) showStudentProfile(source.studentId);
    }

    async function advanceRepertoire(repertoireId) {
      const piece = repertoireById(repertoireId);
      if (!piece) return toast('Piece not found', '', 'error');
      const index = REPERTOIRE_STAGES.indexOf(piece.status);
      if (index < 0 || index >= REPERTOIRE_STAGES.length - 1) return;
      piece.status = REPERTOIRE_STAGES[index + 1];
      piece.lastWorkedOn = localIso();
      piece.updatedAt = timestamp();

      logActivity(`Moved ${piece.title} to ${piece.status} for ${studentName(piece.studentId)}.`, 'repertoire', '#repertoire');
      if (!await persist(['repertoire', 'activity'], `Moved to ${piece.status}`, `${piece.title} remains in the student’s permanent repertoire history.`)) return;

    }

      const okay = await confirmAction(`Generate ${monthLabel(period)} tuition?`, `This will add ${plural(missing.length, 'charge')} and skip students who already have one.`, 'Generate charges', 'primary');

        state.data.tuitionCharges.push({

          period,
          dueDate: `${period}-05`,
          amount: Number(student.tuitionAmount || state.data.settings.defaultTuition),

          voidedAt: '',

    async function saveConvertInquiryForm(form) {
      if (!form.reportValidity()) return;

        form.elements.firstName.setCustomValidity(`${studentName(duplicate)} is already an active student.`);

        return;
      }
      const proposedStart = minutesFromTime(values.scheduleTime);
      const proposedEnd = proposedStart + Number(values.duration);
      const overlap = state.data.recurringSchedules.find((schedule) => {
        if (schedule.active === false || schedule.day !== values.scheduleDay) return false;
        const otherStart = minutesFromTime(schedule.startTime);
        return proposedStart < otherStart + Number(schedule.duration) && proposedEnd > otherStart;
      });
      if (overlap) {
        form.elements.scheduleTime.setCustomValidity(`${studentName(overlap.studentId)} already has a recurring lesson at ${formatTime(overlap.startTime)}.`);

            firstName: values.guardianFirstName.trim(),
            lastName: values.guardianLastName.trim(),
            email: inquiry.email,
            phone: inquiry.phone,
            preferredContact: 'Email',
            notes: 'Created during inquiry conversion.',
            createdAt: now,
            updatedAt: now

          state.data.guardians.push(guardian);

        state.data.studentGuardians.push({
          id: makeId('sg'),

          relationship: values.guardianRelationship,

          createdAt: now,

        trial.studentId = studentId;
        trial.inquiryId = '';

    async function moveParticipant(participantId, direction) {
      const participant = state.data.recitalParticipants.find((item) => item.id === participantId);
      if (!participant) return;
      if (recitalById(participant.recitalId)?.status === 'Completed') return toast('Completed recitals are read-only', 'The final program order was not changed.', 'error');
      const ordered = participantsForRecital(participant.recitalId);
      const index = ordered.findIndex((item) => item.id === participantId);
      const targetIndex = index + Number(direction);
      if (targetIndex < 0 || targetIndex >= ordered.length) return;
      [ordered[index], ordered[targetIndex]] = [ordered[targetIndex], ordered[index]];
      const now = timestamp();
      ordered.forEach((item, order) => {
        item.order = order + 1;
        item.updatedAt = now;
      });
      if (!await persist(['recitalParticipants'], 'Program order updated', `${studentName(participant.studentId)} moved to position ${targetIndex + 1}.`)) return;
      render();
    }

    async function updateParticipantReadiness(participantId, readiness) {
      const participant = state.data.recitalParticipants.find((item) => item.id === participantId);
      if (!participant || !['Learning', 'Developing', 'Polishing', 'Performance Ready'].includes(readiness)) return;
      if (recitalById(participant.recitalId)?.status === 'Completed') return toast('Completed recitals are read-only', 'Readiness history was not changed.', 'error');
      participant.readiness = readiness;
      participant.updatedAt = timestamp();
      const piece = repertoireById(participant.repertoireId);
      if (piece && piece.status !== 'Completed') {
        piece.status = readiness;
        piece.lastWorkedOn = localIso();
        piece.updatedAt = participant.updatedAt;
      }
      if (!await persist(['recitalParticipants', 'repertoire'], 'Readiness updated', `${studentName(participant.studentId)} is now ${readiness}.`)) return;
      render();
    }

    async function completeRecital(recitalId) {
      const recital = recitalById(recitalId);
      if (!recital || recital.status === 'Completed') return;
      const participants = participantsForRecital(recital.id);
      const notReady = participants.filter((item) => item.readiness !== 'Performance Ready').length;
      const okay = await confirmAction('Mark this recital complete?', `${plural(participants.length, 'performer')} will remain in the saved program history${notReady ? `; ${plural(notReady, 'performer')} is not marked Performance Ready` : ''}.`, 'Complete recital', 'primary');
      if (!okay) return;
      participants.forEach((participant) => {
        const piece = repertoireById(participant.repertoireId);
        participant.studentNameSnapshot = studentName(participant.studentId);
        participant.pieceTitleSnapshot = piece?.title || '';
        participant.composerSnapshot = piece?.composer || '';
        participant.updatedAt = timestamp();
      });
      recital.status = 'Completed';
      recital.updatedAt = timestamp();
      logActivity(`Completed ${recital.name}.`, 'recital', '#recitals');
      if (!await persist(['recitalParticipants', 'recitals', 'activity'], 'Recital completed', 'The final roster, performer labels, pieces, and program order remain in history.')) return;
      render();
    }

    async function saveExpenseForm(form) {
      if (!requireTrimmed(form, ['date', 'vendor', 'category', 'description', 'amount']) || !form.reportValidity()) return;
      const values = formValues(form);
      const amount = positiveNumber(values.amount);
      if (!amount) {
        form.elements.amount.setCustomValidity('Enter an amount greater than zero.');
        form.elements.amount.reportValidity();
        return;
      }
      const existing = values.id ? state.data.expenses.find((item) => item.id === values.id) : null;
      const now = timestamp();
      const record = {
        id: existing?.id || makeId('exp'),
        date: values.date,
        vendor: values.vendor.trim(),
        category: values.category,
        description: values.description.trim(),
        amount,
        notes: String(values.notes || '').trim(),
        createdAt: existing?.createdAt || now,
        updatedAt: now
      };
      if (existing) Object.assign(existing, record);
      else state.data.expenses.push(record);
      logActivity(`${existing ? 'Updated' : 'Recorded'} ${money(amount, true)} expense at ${record.vendor}.`, 'expense', '#expenses');
      if (!await persist(['expenses', 'activity'], existing ? 'Expense updated' : 'Expense recorded', `${record.category} · ${money(amount, true)}.`)) return;
      closeModal();
      render();
    }

    function csvCell(value) {
      let text = String(value ?? '');
      if (/^[=+\-@]/.test(text)) text = `'${text}`;
      return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function downloadFile(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportExpenses() {
      const headers = ['Date', 'Vendor', 'Category', 'Description', 'Amount', 'Notes'];
      const rows = [...state.data.expenses].sort((a, b) => a.date.localeCompare(b.date)).map((expense) => [expense.date, expense.vendor, expense.category, expense.description, Number(expense.amount).toFixed(2), expense.notes]);
      const csv = [headers, ...rows].map((row) => row.map(csvCell).join(',')).join('\r\n');
      downloadFile(`harmony-house-expenses-${localIso()}.csv`, csv, 'text/csv;charset=utf-8');
      toast('Expense CSV downloaded', `${plural(rows.length, 'record')} included.`);
    }

    async function resetData(form) {
      const value = form.elements.confirmation.value.trim();
      if (value !== RESET_TOKEN) {
        form.elements.confirmation.setCustomValidity(`Type exactly: ${RESET_TOKEN}`);
        form.elements.confirmation.reportValidity();
        return;
      }
      const seed = createSeedData();
      setSaveState('saving', 'Resetting…');
      try {
        const result = await Repository.reset(seed);
        state.data = normalizeData(result?.state || seed);
        const generated = ensureLessonOccurrences();
        if (generated) {
          const saveResult = await Repository.save(state.data, ['lessons']);
          if (Repository.mode === 'sheets' && saveResult?.state) state.data = normalizeData(saveResult.state);
        }
        state.committedData = clone(state.data);
        state.routeId = null;
        state.selectedRecitalId = null;
        closeModal(false);
        setTheme(state.data.settings.appearance?.theme || 'system');
        setSaveState('saved');
        updateStorageMode(true);
        navigate('dashboard');
        toast('Sample studio restored', 'All demo records are back to their original state.');
      } catch (error) {
        setSaveState('error');
        toast('Reset failed', error.message || 'No records were intentionally changed.', 'error', 6000);
      }
    }

    function globalSearchResults(query) {
      const value = query.trim().toLowerCase();
      if (value.length < 2) return [];
      const results = [];
      state.data.students.forEach((student) => {
        if (studentContactSearchText(student.id).includes(value)) {
          const guardian = guardianLinksForStudent(student.id).find((link) => [link.guardian.email, link.guardian.phone].some((item) => String(item || '').toLowerCase().includes(value)));
          results.push({ view: 'students', id: student.id, title: studentName(student), detail: guardian ? `${guardian.guardian.firstName} ${guardian.guardian.lastName} · ${guardian.guardian.email || guardian.guardian.phone}` : `${student.level} · ${student.status}`, icon: 'students' });
        }
      });
      state.data.repertoire.forEach((piece) => {
        if ([piece.title, piece.composer, studentName(piece.studentId)].some((item) => String(item || '').toLowerCase().includes(value))) {
          results.push({ view: 'students', id: piece.studentId, title: piece.title, detail: `${piece.composer} · ${studentName(piece.studentId)}`, icon: 'music' });
        }
      });
      state.data.inquiries.forEach((inquiry) => {
        if ([inquiry.prospectName, inquiry.guardianName, inquiry.email, inquiry.phone].some((item) => String(item || '').toLowerCase().includes(value))) {
          results.push({ view: 'inquiries', id: inquiry.id, title: inquiry.prospectName, detail: `Inquiry · ${inquiry.status}`, icon: 'inbox' });
        }
      });
      state.data.recitals.forEach((recital) => {
        if ([recital.name, recital.location].some((item) => String(item || '').toLowerCase().includes(value))) {
          results.push({ view: 'recitals', id: recital.id, title: recital.name, detail: `${formatDate(recital.date)} · ${recital.location}`, icon: 'recital' });
        }
      });
      return results.slice(0, 9);
    }

    function closeGlobalSearch(restoreFocus = false) {
      const input = $('#globalSearch');
      const root = $('#searchResults');
      root?.classList.remove('open');
      input?.setAttribute('aria-expanded', 'false');

    function updateGlobalSearch() {
      const input = $('#globalSearch');
      const root = $('#searchResults');
      if (!input || !root || !state.data) return;

      if (input.value.trim().length < 2) {
        closeGlobalSearch();

      root.classList.add('open');

      if (!state.data) return;
      fieldCounter = 0;
      if (state.view === 'recitals' && state.routeId && recitalById(state.routeId)) state.selectedRecitalId = state.routeId;
      const renderers = {
        dashboard: renderDashboard,
        schedule: renderSchedule,
        students: renderStudents,
        lessons: renderLessons,
        repertoire: renderRepertoire,
        billing: renderBilling,
        inquiries: renderInquiries,
        recitals: renderRecitals,
        expenses: renderExpenses,
        reports: renderReports,
        settings: renderSettings
      };
      const page = $('#pageHost');
      page.innerHTML = (renderers[state.view] || renderDashboard)();
      updateNavigation();
      document.title = `${VIEW_TITLES[state.view] || 'Studio'} · ${state.data.settings.studioName}`;
      if (!options.keepScroll) page.scrollTop = 0;
      requestAnimationFrame(() => {
        if (state.view === 'students' && state.routeId && studentById(state.routeId)) showStudentProfile(state.routeId);
        if (state.view === 'inquiries' && state.routeId && state.data.inquiries.some((item) => item.id === state.routeId)) showInquiryDetail(state.routeId);
      });

    function renderFilterAndRestore(element) {
      const id = element.id;
      const start = element.selectionStart;
      const end = element.selectionEnd;
      render({ keepScroll: true });
      requestAnimationFrame(() => {
        const replacement = document.getElementById(id);
        if (!replacement) return;
        replacement.focus();
        if (typeof start === 'number' && replacement.setSelectionRange) replacement.setSelectionRange(start, end);
      });
    }

    function shiftSchedule(days) {
      const next = new Date(state.scheduleCursor);
      next.setDate(next.getDate() + days);
      state.scheduleCursor = startOfWeek(next);
      render();
    }

    function closeMobileNav() {
      document.body.classList.remove('nav-open');
      $('[data-action="toggle-nav"]')?.setAttribute('aria-expanded', 'false');
    }

    function handleAction(action, element) {
      const id = element.dataset.id || '';
      switch (action) {
        case 'toggle-nav': {
          const open = document.body.classList.toggle('nav-open');
          element.setAttribute('aria-expanded', String(open));
          break;
        }
        case 'close-nav': closeMobileNav(); break;
        case 'close-modal': closeModal(); break;
        case 'close-drawer':
          closeDrawer();
          if (state.routeId) navigate(state.view);
          break;
        case 'confirm-no': finishConfirm(false); break;
        case 'confirm-yes': finishConfirm(true); break;
        case 'cycle-theme': cycleTheme(); break;
        case 'set-theme':
          setTheme(element.dataset.theme);
          persist(['settings'], 'Theme updated', element.dataset.theme === 'system' ? 'The studio follows your device.' : `${element.dataset.theme[0].toUpperCase()}${element.dataset.theme.slice(1)} theme is active.`);
          render();
          break;
        case 'quick-add': openQuickAdd(); break;
        case 'open-more': openMoreMenu(); break;
        case 'open-data-tools': openDataTools(); break;
        case 'new-student': openStudentModal(); break;
        case 'edit-student': openStudentModal(id); break;
        case 'open-student': navigate('students', id); break;
        case 'new-guardian': openGuardianModal(element.dataset.studentId || state.routeId || ''); break;
        case 'edit-guardian': {
          const link = state.data.studentGuardians.find((item) => item.id === id);
          if (link) openGuardianModal(link.studentId, link.id);
          break;
        }
        case 'unlink-guardian': unlinkGuardian(id); break;
        case 'student-tab':
          state.studentTab = element.dataset.tab;
          if (state.routeId) showStudentProfile(state.routeId);
          break;
        case 'add-lesson-note': {
          const nextLesson = state.data.lessons.filter((lesson) => lesson.studentId === id && lesson.status === 'Scheduled').sort(byDateTime)[0];
          if (nextLesson) openLessonWorkspace(nextLesson.id);
          else openLessonModal(null, { studentId: id, date: localIso() });
          break;
        }
        case 'new-lesson': openLessonModal(); break;
        case 'edit-lesson': openLessonModal(id); break;
        case 'open-lesson': openLessonWorkspace(id); break;
        case 'add-assignment-row': addAssignmentRow(); break;
        case 'remove-assignment-row': removeAssignmentRow(element); break;
        case 'schedule-prev': shiftSchedule(-7); break;
        case 'schedule-next': shiftSchedule(7); break;
        case 'schedule-today': state.scheduleCursor = startOfWeek(); render(); break;
        case 'schedule-mode': state.scheduleMode = element.dataset.mode; render(); break;
        case 'new-repertoire': openRepertoireModal(null, element.dataset.studentId || ''); break;
        case 'edit-repertoire': openRepertoireModal(id); break;
        case 'advance-repertoire': advanceRepertoire(id); break;
        case 'reactivate-repertoire': reactivateRepertoire(id); break;
        case 'repertoire-status': state.repertoireStatus = element.dataset.status; render(); break;
        case 'new-charge': openChargeModal(element.dataset.studentId || ''); break;
        case 'new-payment': openPaymentModal(element.dataset.chargeId || '', element.dataset.studentId || ''); break;
        case 'generate-tuition': generateTuition(); break;
        case 'billing-tab': state.billingTab = element.dataset.tab; render(); break;
        case 'schedule-makeup': openMakeupModal(id); break;
        case 'waive-makeup': waiveMakeup(id); break;
        case 'new-inquiry': openInquiryModal(); break;
        case 'edit-inquiry': openInquiryModal(id); break;
        case 'open-inquiry': navigate('inquiries', id); break;
        case 'follow-up-inquiry': openFollowUpModal(id); break;
        case 'advance-inquiry': advanceInquiry(id, element.dataset.status); break;
        case 'schedule-trial': openLessonModal(null, { inquiryId: id, type: 'Trial', duration: 30, date: addDays(7) }); break;
        case 'convert-inquiry': openConvertInquiryModal(id); break;
        case 'show-closed-inquiries': showClosedInquiries(); break;
        case 'new-recital': openRecitalModal(); break;
        case 'edit-recital': openRecitalModal(id); break;
        case 'select-recital':
        case 'go-recitals':
          state.selectedRecitalId = id;
          navigate('recitals', id);
          break;
        case 'add-participant': openParticipantModal(element.dataset.recitalId || id); break;
        case 'move-participant': moveParticipant(id, element.dataset.direction); break;
        case 'complete-recital': completeRecital(id); break;
        case 'preview-program': previewProgram(id); break;
        case 'print-program': window.print(); break;
        case 'new-expense': openExpenseModal(); break;
        case 'edit-expense': openExpenseModal(id); break;
        case 'delete-expense': deleteExpense(id); break;
        case 'export-expenses': exportExpenses(); break;
        case 'report-range': state.reportRange = Number(element.dataset.range); render(); break;
        case 'settings-section': state.settingsSection = element.dataset.section; render(); break;
        case 'add-closure': openClosureModal(); break;
        case 'delete-closure': deleteClosure(id); break;
        case 'export-data': exportData(); break;
        case 'reset-data': openResetModal(); break;
        case 'search-result':
          $('#globalSearch').value = '';
          closeGlobalSearch();
          if (element.dataset.view === 'recitals') state.selectedRecitalId = id;
          navigate(element.dataset.view, id || null);
          break;
        default: break;
      }
    }

    function handleFilter(element) {
      const map = {
        'student-query': 'studentQuery',
        'student-status': 'studentStatus',
        'student-day': 'studentDay',
        'student-level': 'studentLevel',
        'student-sort': 'studentSort',
        'lesson-query': 'lessonQuery',
        'lesson-status': 'lessonStatus',
        'lesson-range': 'lessonRange',
        'repertoire-query': 'repertoireQuery',
        'inquiry-query': 'inquiryQuery',
        'expense-query': 'expenseQuery',
        'expense-category': 'expenseCategory',
        'billing-period': 'billingPeriod',
        'billing-query': 'billingQuery',
        'schedule-type': 'scheduleType'
      };
      const key = map[element.dataset.filter];
      if (!key) return;
      state[key] = element.value;
      if (element.matches('input[type="search"]')) renderFilterAndRestore(element);
      else render();
    }

    async function handleSubmit(event) {
      const form = event.target.closest('form[data-form]');
      if (!form) return;
      event.preventDefault();
      const handlers = {
        student: saveStudentForm,
        guardian: saveGuardianForm,
        lesson: saveLessonForm,
        'lesson-workspace': (target) => saveLessonWorkspace(target, event.submitter?.value || event.submitter?.name === 'intent' && event.submitter.value || 'draft'),
        repertoire: saveRepertoireForm,
        charge: saveChargeForm,
        payment: savePaymentForm,
        makeup: saveMakeupForm,
        inquiry: saveInquiryForm,
        'inquiry-follow-up': saveFollowUpForm,
        'convert-inquiry': saveConvertInquiryForm,
        recital: saveRecitalForm,
        participant: saveParticipantForm,
        expense: saveExpenseForm,
        'settings-studio': saveSettingsForm,
        'settings-teaching': saveSettingsForm,
        'settings-policy': saveSettingsForm,
        closure: saveClosureForm,
        reset: resetData
      };
      const handler = handlers[form.dataset.form];
      if (!handler) return;
      $$('button[type="submit"]', form.closest('.modal-root, .page') || document).forEach((button) => { button.disabled = true; });
      try {
        await handler(form);
      } catch (error) {
        console.error(error);
        toast('Something went wrong', error.message || 'The change was not completed.', 'error', 6000);
      } finally {
        $$('button[type="submit"]').forEach((button) => { button.disabled = false; });
      }
    }

    function trapOverlayFocus(event) {
      if (event.key !== 'Tab') return;
      const modal = $('#modalRoot.open');
      const drawer = $('#drawerRoot.open');
      const root = modal || drawer;
      if (!root) return;
      const focusable = getFocusable(root);
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable.at(-1);
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    document.addEventListener('click', (event) => {
      const viewTarget = event.target.closest('[data-view]');
      const actionTarget = event.target.closest('[data-action]');
      if (!event.target.closest('.global-search')) closeGlobalSearch();
      if (actionTarget) {
        event.preventDefault();
        handleAction(actionTarget.dataset.action, actionTarget);
        return;
      }
      if (viewTarget) {
        event.preventDefault();
        navigate(viewTarget.dataset.view);
        return;
      }
      if (event.target.id === 'modalRoot') closeModal();
      if (event.target.id === 'drawerRoot') {
        closeDrawer();
        if (state.routeId) navigate(state.view);
      }
    });

    document.addEventListener('submit', handleSubmit);

    document.addEventListener('input', (event) => {
      if (event.target.id === 'globalSearch') updateGlobalSearch();
      else if (event.target.matches('[data-filter][type="search"]')) handleFilter(event.target);
      event.target.setCustomValidity?.('');
    });

    document.addEventListener('change', (event) => {
      const target = event.target;
      if (target.matches('[data-filter]')) handleFilter(target);
      if (target.matches('[data-student-type]')) updateStudentContactFields();
      if (target.matches('[data-lesson-type]')) updateLessonTypeFields();
      if (target.matches('[data-payment-charge]')) updatePaymentAmount();
      if (target.matches('[data-convert-student-type]')) updateConvertGuardianFields();
      if (target.matches('[data-participant-student]')) updateParticipantPieces();
      if (target.matches('[data-repertoire-stage]')) {
        const completion = target.form?.elements.dateCompleted;
        if (completion && target.value === 'Completed' && !completion.value) completion.value = localIso();
      }
      if (target.matches('[data-recital-readiness]')) updateParticipantReadiness(target.dataset.recitalReadiness, target.value);
      target.setCustomValidity?.('');
    });

    document.addEventListener('keydown', (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault();
        $('#globalSearch')?.focus();
        $('#globalSearch')?.select();
        return;
      }
      const searchOption = event.target.closest('.search-result');
      const searchOptions = $$('.search-result', $('#searchResults') || document);
      if (event.target.id === 'globalSearch' && event.key === 'ArrowDown' && searchOptions.length) {
        event.preventDefault();
        searchOptions[0].focus();
        searchOptions[0].setAttribute('aria-selected', 'true');
        return;
      }
      if (searchOption && ['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) {
        event.preventDefault();
        const index = searchOptions.indexOf(searchOption);
        let nextIndex = event.key === 'Home' ? 0 : event.key === 'End' ? searchOptions.length - 1 : event.key === 'ArrowDown' ? (index + 1) % searchOptions.length : (index - 1 + searchOptions.length) % searchOptions.length;
        searchOptions.forEach((option, optionIndex) => option.setAttribute('aria-selected', String(optionIndex === nextIndex)));
        searchOptions[nextIndex]?.focus();
        return;
      }
      if (event.key === 'Escape') {
        if ($('#searchResults')?.classList.contains('open')) {
          closeGlobalSearch(true);
        } else if ($('#modalRoot')?.classList.contains('open')) closeModal();
        else if ($('#drawerRoot')?.classList.contains('open')) {
          closeDrawer();
          if (state.routeId) navigate(state.view);
        } else closeMobileNav();
      }
      trapOverlayFocus(event);
      if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('tr[data-action]')) {
        event.preventDefault();
        event.target.click();
      }
    });

    window.addEventListener('hashchange', () => {
      parseRoute();
      render();
      requestAnimationFrame(() => $('#pageHost')?.focus({ preventScroll: true }));
    });

    window.addEventListener('storage', async (event) => {
      if (event.key !== STORAGE_KEY || Repository.mode !== 'demo') return;
      const loaded = await Repository.load();
      if (loaded) {
        state.data = normalizeData(loaded);
        state.committedData = clone(state.data);
        render();
        toast('Studio refreshed', 'Changes from another tab are now visible.', 'info');
      }
    });

    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => {
      if ((document.documentElement.dataset.themePreference || 'system') === 'system') setTheme('system');
    });

    async function init() {
      parseRoute();
      updateStorageMode(true);
      try {
        let loaded = await Repository.load();
        const needsSeed = isStudioEmpty(loaded);
        if (needsSeed) loaded = createSeedData();
        state.data = normalizeData(loaded);
        const generated = ensureLessonOccurrences();
        const savedTheme = (() => {
          try { return localStorage.getItem(THEME_KEY); } catch (error) { return null; }
        })();
        setTheme(savedTheme || state.data.settings.appearance?.theme || 'system');
        if (needsSeed || generated) {
          const result = await Repository.save(state.data, needsSeed ? [...COLLECTIONS, 'settings'] : ['lessons']);
          if (Repository.mode === 'sheets' && result?.state) state.data = normalizeData(result.state);
        }
        state.committedData = clone(state.data);
        setSaveState('saved');
        updateStorageMode(true);
        render();
        window.HarmonyHouse = {
          getState: () => clone(state.data),
          navigate,
          version: APP_VERSION
        };
      } catch (error) {
        console.error(error);
        const failedMode = Repository.mode;
        Repository.mode = 'memory';
        Repository.fallbackReason = failedMode === 'sheets' ? 'sheets' : (Repository.fallbackReason || 'browser-storage');
        let fallback = null;
        try { fallback = await Repository.load(); } catch (storageError) { /* use an in-memory sample */ }
        const fallbackNeedsSeed = isStudioEmpty(fallback);
        state.data = normalizeData(fallbackNeedsSeed ? createSeedData() : fallback);
        const generated = ensureLessonOccurrences();
        try {
          if (fallbackNeedsSeed || generated) await Repository.save(state.data, fallbackNeedsSeed ? [...COLLECTIONS, 'settings'] : ['lessons']);
        } catch (storageError) { /* the current tab still remains usable */ }
        state.committedData = clone(state.data);
        setTheme(state.data.settings.appearance?.theme || 'system');
        setSaveState('error');
        updateStorageMode(false);
        render();
        toast('Opened in tab-only mode', error.message || 'Changes may not persist after this tab closes.', 'warning', 6500);
      }
    }

    init();
  })();
  </script>
</body>
</html>
