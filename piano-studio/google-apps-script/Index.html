  <meta name="robots" content="noindex,follow">
  <meta name="description" content="Harmony House is an interactive private piano studio management demo for students, lessons, repertoire, tuition, inquiries, recitals, expenses, and reporting.">
  <link rel="canonical" href="https://jcroasdaile1-del.github.io/formsmith-demos/projects/piano-studio-manager.html">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2376547f'/%3E%3Cpath d='M39 12v31a9 9 0 1 1-5-8V20l18-4v22a9 9 0 1 1-5-8V12z' fill='white'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#211c2b">
  <title>Harmony House — Piano Studio Manager</title>
  <script>
    (() => {
      try {
        const preference = localStorage.getItem('harmony_house_theme') || 'system';
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themePreference = preference;
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.dataset.themePreference = 'system';
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --ink: #27232d;
      --ink-soft: #484250;
      --muted: #716a78;
      --muted-strong: #5e5665;
      --canvas: #f5f1eb;
      --paper: #fffdf9;
      --paper-soft: #faf7f2;
      --paper-raised: #ffffff;
      --line: #e3dcd3;
      --line-strong: #cfc5ba;
      --brand: #76547f;
      --brand-strong: #5d3d66;
      --brand-soft: #eee4f1;
      --brand-faint: #f7f1f8;
      --accent: #a56c45;
      --accent-strong: #824d2c;
      --accent-soft: #f4e4d8;
      --success: #46745f;
      --success-strong: #315b48;
      --success-soft: #dfebe4;
      --warning: #9a6a24;
      --warning-strong: #754b10;
      --warning-soft: #f6ead0;
      --danger: #a44f53;
      --danger-strong: #82383d;
      --danger-soft: #f5e0e1;
      --info: #526f8f;
      --info-strong: #395775;
      --info-soft: #e0e9f2;
      --slate-soft: #ece9ed;
      --slate-text: #645d68;
      --sidebar: #211c2b;
      --sidebar-raised: #312a3b;
      --sidebar-text: #f7f0f5;
      --sidebar-muted: #bbb0c0;
      --sidebar-line: rgba(255, 255, 255, .09);
      --overlay: rgba(31, 25, 36, .58);
      --shadow-sm: 0 1px 2px rgba(35, 29, 25, .05), 0 6px 20px rgba(35, 29, 25, .04);
      --shadow-md: 0 18px 48px rgba(35, 29, 25, .14);
      --shadow-lg: 0 30px 90px rgba(25, 20, 29, .26);
      --focus: rgba(118, 84, 127, .2);
      --white: #ffffff;
      --black: #000000;
      --radius-xs: 7px;
      --radius-sm: 10px;
      --radius: 15px;
      --radius-lg: 21px;
      --sidebar-width: 254px;
      --topbar-height: 72px;
      --ribbon-height: 34px;
      --tap: 44px;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --ink: #f1ebf1;
      --ink-soft: #d5ccd7;
      --muted: #aaa0ad;
      --muted-strong: #c0b6c3;
      --canvas: #17141b;
      --paper: #211d26;
      --paper-soft: #29232f;
      --paper-raised: #2d2733;
      --line: #403747;
      --line-strong: #574b60;
      --brand: #c49bce;
      --brand-strong: #ddb7e5;
      --brand-soft: #403047;
      --brand-faint: #2d2432;
      --accent: #d79a70;
      --accent-strong: #efb98f;
      --accent-soft: #493327;
      --success: #84b99e;
      --success-strong: #a4d2ba;
      --success-soft: #293d33;
      --warning: #dbad62;
      --warning-strong: #f0c67f;
      --warning-soft: #45371f;
      --danger: #dd8d91;
      --danger-strong: #efaaad;
      --danger-soft: #4a2d31;
      --info: #8fb0d4;
      --info-strong: #b1cbe5;
      --info-soft: #29394b;
      --slate-soft: #39343c;
      --slate-text: #c6bdc8;
      --sidebar: #100e13;
      --sidebar-raised: #29222f;
      --sidebar-text: #f6eef7;
      --sidebar-muted: #afa3b2;
      --sidebar-line: rgba(255, 255, 255, .08);
      --overlay: rgba(4, 3, 5, .7);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .18), 0 7px 24px rgba(0, 0, 0, .13);
      --shadow-md: 0 18px 52px rgba(0, 0, 0, .32);
      --shadow-lg: 0 30px 90px rgba(0, 0, 0, .48);
      --focus: rgba(196, 155, 206, .22);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    body.overlay-open { overflow: hidden; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button, [role="button"] { cursor: pointer; }
    button:disabled, input:disabled, select:disabled, textarea:disabled { cursor: not-allowed; opacity: .62; }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; }
    h1, h2, h3, h4, p { margin: 0; }
    h1, h2, h3, .display {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      letter-spacing: -.025em;
    }
    .hidden { display: none !important; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    :focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
    .skip-link {
      position: fixed;
      z-index: 300;
      top: -100px;
      left: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-xs);
      background: var(--ink);
      color: var(--paper);
      text-decoration: none;
      transition: top .2s ease;
    }
    .skip-link:focus { top: 12px; }
    .icon {
      width: 18px;
      height: 18px;
      display: inline-block;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .demo-ribbon {
      height: var(--ribbon-height);
      padding: 0 134px 0 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      z-index: 70;
      background: var(--sidebar);
      color: var(--sidebar-text);
      font-size: 12px;
    }
    .demo-ribbon strong { font-weight: 800; }
    .ribbon-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--success);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--success) 17%, transparent);
    }
    body.storage-warning .ribbon-dot { background: var(--warning); }
    .ribbon-action {
      min-height: 27px;
      padding: 3px 8px;
      position: absolute;
      right: 9px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: inherit;
      font-size: 11px;
      font-weight: 750;
    }
    .ribbon-action:hover { background: var(--sidebar-line); }

    .app-shell { min-height: calc(100vh - var(--ribbon-height)); }
    .sidebar {
      position: fixed;
      z-index: 50;
      inset: var(--ribbon-height) auto 0 0;
      width: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--sidebar);
      color: var(--sidebar-text);
      border-right: 1px solid var(--sidebar-line);
      transition: transform .25s var(--ease);
    }
    .brand {
      min-height: 88px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--sidebar-line);
      color: inherit;
      text-decoration: none;
    }
    .brand-mark {
      width: 43px;
      height: 43px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--brand) 62%, transparent);
      border-radius: 13px;
      background: color-mix(in srgb, var(--brand) 18%, transparent);
      color: var(--sidebar-text);
    }
    .brand-mark::before {
      content: "";
      position: absolute;
      inset: 9px 6px;
      opacity: .25;
      background: repeating-linear-gradient(to bottom, transparent 0 4px, currentColor 4px 5px);
    }
    .brand-mark strong { position: relative; font-family: Georgia, serif; font-size: 23px; font-weight: 500; }
    .brand-copy { min-width: 0; }
    .brand-copy strong { display: block; font-family: Georgia, serif; font-size: 17px; font-weight: 500; }
    .brand-copy span { display: block; margin-top: 2px; color: var(--sidebar-muted); font-size: 10px; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
    .sidebar-scroll { flex: 1; padding: 17px 12px; overflow-y: auto; overscroll-behavior: contain; }
    .nav-group + .nav-group { margin-top: 19px; }
    .nav-label { margin: 0 10px 7px; color: var(--sidebar-muted); font-size: 10px; font-weight: 850; letter-spacing: .13em; text-transform: uppercase; }
    .nav-list { display: grid; gap: 3px; }
    .nav-item {
      width: 100%;
      min-height: 43px;
      padding: 0 10px;
      display: grid;
      grid-template-columns: 27px minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--sidebar-muted);
      text-align: left;
      font-weight: 680;
      transition: .15s ease;
    }
    .nav-item:hover { color: var(--sidebar-text); background: var(--sidebar-line); }
    .nav-item.active { color: var(--sidebar-text); background: var(--sidebar-raised); box-shadow: inset 2px 0 var(--brand); }
    .nav-item .icon { width: 17px; height: 17px; }
    .nav-count {
      min-width: 22px;
      min-height: 20px;
      padding: 1px 6px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--sidebar-line);
      color: var(--sidebar-text);
      font-size: 10px;
    }
    .sidebar-footer { padding: 12px; border-top: 1px solid var(--sidebar-line); }
    .teacher-chip {
      padding: 9px;
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      border-radius: 11px;
      background: var(--sidebar-line);
    }
    .avatar {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--brand);
      color: var(--white);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .03em;
    }
    .teacher-chip strong, .teacher-chip span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .teacher-chip strong { font-size: 12px; }
    .teacher-chip span { color: var(--sidebar-muted); font-size: 10px; }

    .workspace { min-height: calc(100vh - var(--ribbon-height)); margin-left: var(--sidebar-width); }
    .topbar {
      height: var(--topbar-height);
      padding: 0 26px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: var(--ribbon-height);
      z-index: 35;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 86%, transparent);
      background: color-mix(in srgb, var(--canvas) 91%, transparent);
      backdrop-filter: blur(17px);
    }
    .menu-btn { display: none !important; }
    .topbar-title { min-width: 150px; font-family: Georgia, serif; font-size: 21px; font-weight: 500; }
    .global-search { width: min(440px, 39vw); margin-left: 10px; position: relative; }
    .global-search > .icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; color: var(--muted); pointer-events: none; }
    .global-search input {
      width: 100%;
      height: 42px;
      padding: 0 68px 0 39px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: 0;
      background: color-mix(in srgb, var(--paper) 82%, transparent);
      color: var(--ink);
    }
    .global-search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus); background: var(--paper); }
    .key-hint { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--muted); font-size: 10px; }
    .search-results {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      display: none;
      max-height: 420px;
      padding: 7px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--paper);
      box-shadow: var(--shadow-md);
    }
    .search-results.open { display: grid; gap: 2px; }
    .search-result {
      width: 100%;
      padding: 9px;
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 9px;
      align-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      text-align: left;
    }
    .search-result:hover, .search-result:focus-visible { background: var(--paper-soft); }
    .search-result-icon { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 8px; background: var(--brand-soft); color: var(--brand); }
    .search-result strong, .search-result span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-result strong { font-size: 12px; }
    .search-result span { color: var(--muted); font-size: 10px; }
    .topbar-spacer { flex: 1; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .save-state { min-width: 74px; display: inline-flex; align-items: center; justify-content: flex-end; gap: 6px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .save-state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
    .save-state.saving::before { background: var(--warning); animation: pulse 1s ease-in-out infinite; }
    .save-state.error { color: var(--danger); }
    .save-state.error::before { background: var(--danger); }
    @keyframes pulse { 50% { opacity: .32; } }

    .page { width: min(1540px, 100%); margin: 0 auto; padding: 30px 29px 55px; }
    .page-head { min-height: 64px; margin-bottom: 23px; display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .page-head h1 { font-size: clamp(31px, 3vw, 42px); line-height: 1.04; }
    .page-head p { max-width: 690px; margin-top: 8px; color: var(--muted); }
    .page-actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
    .eyebrow { color: var(--brand); font-size: 10px; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
    .section-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 13px; }
    .section-title h2 { font-size: 24px; }
    .section-title p { margin-top: 4px; color: var(--muted); font-size: 12px; }

    .btn {
      min-height: var(--tap);
      padding: 9px 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: var(--ink);
      color: var(--paper);
      font-weight: 760;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 22px color-mix(in srgb, var(--ink) 15%, transparent); }
    .btn.primary { background: var(--brand); color: var(--white); }
    .btn.primary:hover:not(:disabled) { background: var(--brand-strong); }
    .btn.accent { background: var(--accent); color: var(--white); }
    .btn.secondary { border-color: var(--line); background: var(--paper); color: var(--ink); }
    .btn.secondary:hover:not(:disabled) { border-color: var(--line-strong); background: var(--paper-raised); }
    .btn.ghost { background: transparent; color: var(--ink); }
    .btn.ghost:hover:not(:disabled) { background: color-mix(in srgb, var(--ink) 6%, transparent); box-shadow: none; }
    .btn.danger { background: var(--danger-soft); color: var(--danger-strong); }
    .btn.small { min-height: 34px; padding: 6px 10px; border-radius: 8px; font-size: 12px; }
    .btn.icon-only, .icon-btn {
      width: var(--tap);
      min-width: var(--tap);
      height: var(--tap);
      padding: 0;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--paper);
      color: var(--ink);
    }
    .icon-btn:hover { border-color: var(--line-strong); background: var(--paper-raised); }
    .btn .icon, .icon-btn .icon { width: 17px; height: 17px; }
    .link-btn { min-height: 34px; padding: 4px 0; border: 0; background: transparent; color: var(--brand); font-weight: 760; }
    .link-btn:hover { color: var(--brand-strong); text-decoration: underline; }

    .card { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); box-shadow: var(--shadow-sm); }
    .card-pad { padding: 20px; }
    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; margin-bottom: 20px; }
    .metric-card { min-height: 135px; padding: 18px; overflow: hidden; position: relative; }
    .metric-card::after { content: ""; width: 92px; height: 92px; position: absolute; right: -32px; bottom: -42px; border-radius: 50%; background: var(--metric-soft, var(--brand-soft)); opacity: .75; }
    .metric-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .metric-label { color: var(--muted); font-size: 11px; font-weight: 820; letter-spacing: .06em; text-transform: uppercase; }
    .metric-icon { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 9px; background: var(--metric-soft, var(--brand-soft)); color: var(--metric-color, var(--brand)); }
    .metric-icon .icon { width: 16px; height: 16px; }
    .metric-value { display: block; margin-top: 13px; font-family: Georgia, serif; font-size: 29px; font-weight: 500; line-height: 1; }
    .metric-note { margin-top: 7px; color: var(--muted); font-size: 11px; }
    .metric-card.success { --metric-color: var(--success); --metric-soft: var(--success-soft); }
    .metric-card.warning { --metric-color: var(--warning); --metric-soft: var(--warning-soft); }
    .metric-card.danger { --metric-color: var(--danger); --metric-soft: var(--danger-soft); }
    .metric-card.info { --metric-color: var(--info); --metric-soft: var(--info-soft); }

    .grid { display: grid; gap: 16px; }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, .75fr); gap: 17px; align-items: start; }
    .stack { display: grid; gap: 16px; }
    .card-head { min-height: 58px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
    .card-head h2, .card-head h3 { font-size: 19px; }
    .card-head p { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .card-body { padding: 17px 18px; }
    .card-foot { padding: 12px 18px; border-top: 1px solid var(--line); background: var(--paper-soft); }

    .status {
      min-height: 25px;
      padding: 3px 9px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      background: var(--slate-soft);
      color: var(--slate-text);
      font-size: 10px;
      font-weight: 820;
      white-space: nowrap;
    }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status.scheduled, .status.contacted, .status.learning, .status.partial, .status.in-progress, .status.trial-scheduled { background: var(--info-soft); color: var(--info-strong); }
    .status.completed, .status.active, .status.paid, .status.converted, .status.performance-ready, .status.ready { background: var(--success-soft); color: var(--success-strong); }
    .status.overdue, .status.no-show, .status.not-moving-forward, .status.cancelled { background: var(--danger-soft); color: var(--danger-strong); }
    .status.owed, .status.waitlist, .status.polishing, .status.enrolling, .status.trial-completed { background: var(--warning-soft); color: var(--warning-strong); }
    .status.new, .status.developing, .status.rescheduled { background: var(--brand-soft); color: var(--brand-strong); }
    .status.inactive, .status.waived, .status.expired, .status.student-cancelled, .status.teacher-cancelled { background: var(--slate-soft); color: var(--slate-text); }
    .tag { padding: 3px 8px; display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--paper-soft); color: var(--muted-strong); font-size: 10px; font-weight: 720; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }

    .avatar-name { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .avatar-name .avatar { width: 35px; height: 35px; background: var(--brand-soft); color: var(--brand-strong); }
    .avatar-name strong, .avatar-name span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .lesson-list, .attention-list, .timeline { display: grid; }

    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }

    .mobile-nav, .mobile-scrim { display: none; }
    .toast-region { position: fixed; z-index: 250; right: 18px; bottom: 18px; display: grid; gap: 8px; pointer-events: none; }

      width: min(360px, calc(100vw - 28px));

    .toast.warning .toast-icon { background: var(--warning-soft); color: var(--warning-strong); }

    .toast span { margin-top: 2px; color: var(--muted); font-size: 10px; }

    @media (max-width: 1180px) {

      .recital-layout { grid-template-columns: minmax(0, 1fr); }

    @media (max-width: 680px) {

      .field input, .field select, .field textarea, .toolbar input, .toolbar select { font-size: 16px; }
      .btn.small, .link-btn, .segmented button { min-height: var(--tap); }
      button.icon-btn { width: var(--tap) !important; min-width: var(--tap) !important; height: var(--tap) !important; }
      [data-recital-readiness] { min-height: var(--tap) !important; font-size: 16px; }

      .pipeline { grid-template-columns: repeat(6, minmax(255px, 82vw)); }

      .metric-grid { grid-template-columns: minmax(0, 1fr); }

  <script>
  (() => {
    'use strict';

    const APP_VERSION = 1;
    const STORAGE_KEY = 'harmony_house_studio_v1';
    const THEME_KEY = 'harmony_house_theme';
    const RESET_TOKEN = 'RESET HARMONY HOUSE';
    const COLLECTIONS = [
      'students', 'guardians', 'studentGuardians', 'recurringSchedules', 'lessons',
      'repertoire', 'assignments', 'tuitionCharges', 'payments', 'makeupCredits',
      'inquiries', 'recitals', 'recitalParticipants', 'expenses', 'activity'
    ];
    const VALID_VIEWS = ['dashboard', 'schedule', 'students', 'lessons', 'repertoire', 'billing', 'inquiries', 'recitals', 'expenses', 'reports', 'settings'];
    const LEVELS = ['Beginner', 'Elementary', 'Late Elementary', 'Early Intermediate', 'Intermediate', 'Late Intermediate', 'Advanced'];
    const LESSON_STATUSES = ['Scheduled', 'Completed', 'Student Cancelled', 'Teacher Cancelled', 'No Show', 'Rescheduled'];
    const LESSON_TYPES = ['Regular', 'Trial', 'Makeup', 'Rescheduled'];
    const REPERTOIRE_STAGES = ['New', 'Learning', 'Developing', 'Polishing', 'Performance Ready', 'Completed'];
    const INQUIRY_STAGES = ['New Inquiry', 'Contacted', 'Trial Scheduled', 'Trial Completed', 'Enrolling', 'Waitlist'];
    const INQUIRY_ALL_STAGES = [...INQUIRY_STAGES, 'Converted', 'Not Moving Forward'];
    const INQUIRY_MANUAL_STAGES = ['New Inquiry', 'Contacted', 'Enrolling', 'Waitlist', 'Not Moving Forward'];
    const PAYMENT_METHODS = ['Cash', 'Check', 'Venmo', 'Zelle', 'Bank transfer', 'Other'];
    const EXPENSE_CATEGORIES = ['Sheet music', 'Method books', 'Piano maintenance', 'Equipment', 'Studio supplies', 'Advertising', 'Professional development', 'Memberships', 'Software', 'Studio rent', 'Mileage / travel', 'Other'];
    const TECHNIQUE_AREAS = ['Scales', 'Arpeggios', 'Chords', 'Cadences', 'Sight-reading', 'Ear training', 'Rhythm'];
    const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const NAV_GROUPS = [
      { label: 'Studio', items: [
        ['dashboard', 'Dashboard', 'dashboard'],
        ['schedule', 'Schedule', 'calendar'],
        ['students', 'Students', 'students'],
        ['lessons', 'Lessons', 'lessons'],
        ['repertoire', 'Repertoire', 'music']
      ]},
      { label: 'Business', items: [
        ['billing', 'Billing', 'billing'],
        ['inquiries', 'Inquiries', 'inbox'],
        ['recitals', 'Recitals', 'recital'],
        ['expenses', 'Expenses', 'expense'],
        ['reports', 'Reports', 'reports']
      ]},
      { label: 'System', items: [['settings', 'Settings', 'settings']] }
    ];
    const VIEW_TITLES = Object.fromEntries(NAV_GROUPS.flatMap((group) => group.items.map(([view, label]) => [view, label])));
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
    const icon = (name, className = '') => `<svg class="icon ${className}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
    const escapeAttr = escapeHtml;
    const clone = (value) => JSON.parse(JSON.stringify(value));
    const slug = (value) => String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const normalizePhone = (value) => String(value || '').replace(/\D/g, '');
    const money = (value, cents = false) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: cents ? 2 : 0, minimumFractionDigits: cents ? 2 : 0 }).format(Number(value || 0));
    const plural = (count, one, many = `${one}s`) => `${count} ${count === 1 ? one : many}`;
    const sum = (items, selector = (value) => value) => items.reduce((total, item) => total + Number(selector(item) || 0), 0);
    const unique = (items) => [...new Set(items)];
    const byDateTime = (a, b) => `${a.date || ''}${a.startTime || ''}`.localeCompare(`${b.date || ''}${b.startTime || ''}`);
    let fieldCounter = 0;

    function controlId(name) {
      fieldCounter += 1;
      return `field-${slug(name)}-${fieldCounter}`;
    }

    function localIso(value = new Date()) {
      const date = new Date(value);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function parseDate(iso) {
      if (!iso) return null;
      const [year, month, day] = String(iso).split('-').map(Number);
      if (!year || !month || !day) return null;
      return new Date(year, month - 1, day, 12);
    }

    function addDays(days, base = new Date()) {
      const date = new Date(base);
      date.setHours(12, 0, 0, 0);
      date.setDate(date.getDate() + Number(days || 0));
      return localIso(date);
    }

    function addMonths(months, base = new Date()) {
      const date = new Date(base);
      date.setHours(12, 0, 0, 0);
      date.setDate(1);
      date.setMonth(date.getMonth() + Number(months || 0));
      return date;
    }

    function monthKey(months = 0) {
      return localIso(addMonths(months)).slice(0, 7);
    }

    function dateInMonth(months, day) {
      const date = addMonths(months);
      date.setDate(day);
      return localIso(date);
    }

    function formatDate(iso, options = { month: 'short', day: 'numeric', year: 'numeric' }) {
      const date = parseDate(iso);
      return date ? new Intl.DateTimeFormat('en-US', options).format(date) : 'Not set';
    }

    function shortDate(iso) {
      return formatDate(iso, { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function monthLabel(period) {
      const date = parseDate(`${period}-01`);
      return date ? new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(date) : period;
    }

    function formatTime(time) {
      if (!time) return 'Time TBD';
      const [hour, minute] = String(time).split(':').map(Number);
      return new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit' }).format(new Date(2020, 0, 1, hour, minute));
    }

    function relativeDate(iso) {
      const date = parseDate(iso);
      if (!date) return 'No date';
      const diff = Math.round((date - parseDate(localIso())) / 86400000);
      if (diff === 0) return 'Today';
      if (diff === 1) return 'Tomorrow';
      if (diff === -1) return 'Yesterday';
      if (diff > 1 && diff < 8) return `In ${diff} days`;
      if (diff < -1 && diff > -8) return `${Math.abs(diff)} days ago`;
      return shortDate(iso);
    }

    function initials(name) {
      return String(name || '?').trim().split(/\s+/).filter(Boolean).slice(0, 2).map((part) => part[0]).join('').toUpperCase();
    }

    function makeId(prefix) {
      return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function timestamp() {
      return new Date().toISOString();
    }

    function startOfWeek(value = new Date()) {
      const date = new Date(value);
      date.setHours(12, 0, 0, 0);
      date.setDate(date.getDate() - date.getDay());
      return date;
    }

    function dateForDayName(weekStart, dayName) {
      const date = new Date(weekStart);
      date.setDate(date.getDate() + Math.max(0, DAY_NAMES.indexOf(dayName)));
      return localIso(date);
    }

    function dateOfBirthForAge(age, offset = 0) {
      const date = new Date();
      date.setFullYear(date.getFullYear() - age);
      date.setMonth((date.getMonth() + offset + 12) % 12);
      date.setDate(8 + (offset % 17));
      return localIso(date);
    }

    function dateAge(iso) {
      const birth = parseDate(iso);
      if (!birth) return null;
      const now = new Date();
      let age = now.getFullYear() - birth.getFullYear();
      if (now.getMonth() < birth.getMonth() || (now.getMonth() === birth.getMonth() && now.getDate() < birth.getDate())) age -= 1;
      return age;
    }

    function greeting() {
      const hour = new Date().getHours();
      if (hour < 12) return 'Good morning';
      if (hour < 17) return 'Good afternoon';
      return 'Good evening';
    }

    function callServer(functionName, ...args) {
      return new Promise((resolve, reject) => {
        try {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler((error) => reject(new Error(error?.message || String(error))))
            [functionName](...args);
        } catch (error) {
          reject(error);
        }
      });
    }

        if (this.mode === 'memory') return this.memoryData ? clone(this.memoryData) : null;
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (error) {
          console.warn('Harmony House demo data could not be loaded.', error);
          this.mode = 'memory';
          this.fallbackReason = 'browser-storage';
          return this.memoryData ? clone(this.memoryData) : null;
        }
      },
      async save(data, collections = COLLECTIONS) {
        if (this.mode === 'sheets') return callServer('saveStudioCollections', data, collections);
        if (this.mode === 'memory') {
          this.memoryData = clone(data);
          return { ok: true, savedCollections: collections, storageMode: 'memory' };
        }
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          return { ok: true, savedCollections: collections };
        } catch (error) {

          this.mode = 'memory';

    function isStudioEmpty(data) {
      if (!data || typeof data !== 'object') return true;
      const noRecords = COLLECTIONS.every((collection) => !Array.isArray(data[collection]) || data[collection].length === 0);
      const noSettings = !data.settings || Object.keys(data.settings).length === 0;
      return noRecords && noSettings;
    }

    function normalizeData(data) {
      const defaults = createSeedData();
      if (!data || typeof data !== 'object') return defaults;
      const normalized = {
        version: APP_VERSION,
        seededAt: data.seededAt || defaults.seededAt,
        settings: {
          ...defaults.settings,
          ...(data.settings || {}),
          appearance: { ...defaults.settings.appearance, ...(data.settings?.appearance || {}) },
          studioClosures: Array.isArray(data.settings?.studioClosures) ? data.settings.studioClosures : defaults.settings.studioClosures,
          defaultLessonLengths: Array.isArray(data.settings?.defaultLessonLengths) ? data.settings.defaultLessonLengths : defaults.settings.defaultLessonLengths,
          teachingDays: Array.isArray(data.settings?.teachingDays) ? data.settings.teachingDays : defaults.settings.teachingDays
        }
      };
      COLLECTIONS.forEach((collection) => {
        normalized[collection] = Array.isArray(data[collection]) ? data[collection] : defaults[collection];
      });
      normalized.students = normalized.students.map((student) => ({ status: 'Active', preferredName: '', tuitionAmount: 0, ...student, billingModel: 'Monthly tuition' }));
      normalized.guardians = normalized.guardians.map((guardian) => ({ notes: '', preferredContact: 'Email', ...guardian }));
      normalized.studentGuardians = normalized.studentGuardians.map((link) => ({ relationship: 'Guardian', primaryContact: false, billingContact: false, notes: '', ...link }));
      normalized.lessons = normalized.lessons.map((lesson) => ({ type: 'Regular', status: 'Scheduled', technique: [], repertoireProgress: [], ...lesson, technique: Array.isArray(lesson.technique) ? lesson.technique : [], repertoireProgress: Array.isArray(lesson.repertoireProgress) ? lesson.repertoireProgress : [] }));
      normalized.repertoire = normalized.repertoire.map((item) => ({ status: 'New', notes: '', reactivatedFromId: '', ...item }));
      normalized.assignments = normalized.assignments.map((assignment) => ({ status: 'Current', ...assignment }));
      normalized.tuitionCharges = normalized.tuitionCharges.map((charge) => ({ status: 'Posted', voidedAt: '', voidReason: '', ...charge }));
      normalized.payments = normalized.payments.map((payment) => ({ status: 'Posted', voidedAt: '', voidReason: '', ...payment }));
      normalized.recitalParticipants = normalized.recitalParticipants.map((participant) => {
        const recital = normalized.recitals.find((item) => item.id === participant.recitalId);
        const student = normalized.students.find((item) => item.id === participant.studentId);
        const piece = normalized.repertoire.find((item) => item.id === participant.repertoireId);
        const completed = recital?.status === 'Completed';
        return {
          ...participant,
          studentNameSnapshot: completed ? (participant.studentNameSnapshot || [student?.preferredName || student?.firstName, student?.lastName].filter(Boolean).join(' ') || '') : (participant.studentNameSnapshot || ''),
          pieceTitleSnapshot: completed ? (participant.pieceTitleSnapshot || piece?.title || '') : (participant.pieceTitleSnapshot || ''),
          composerSnapshot: completed ? (participant.composerSnapshot || piece?.composer || '') : (participant.composerSnapshot || '')
        };
      });
      return normalized;
    }

    function ensureLessonOccurrences() {
      const today = localIso();
      let added = 0;
      state.data.recurringSchedules.filter((schedule) => schedule.active !== false).forEach((schedule) => {
        const student = state.data.students.find((item) => item.id === schedule.studentId);
        if (!student || student.status !== 'Active') return;
        for (let weekOffset = 0; weekOffset <= 8; weekOffset += 1) {
          const weekStart = startOfWeek(parseDate(addDays(weekOffset * 7)));
          const date = dateForDayName(weekStart, schedule.day);
          if (date < today || (schedule.effectiveFrom && date < schedule.effectiveFrom) || (schedule.effectiveTo && date > schedule.effectiveTo)) continue;
          const exists = state.data.lessons.some((lesson) => lesson.sourceScheduleId === schedule.id && lesson.date === date);
          if (exists) continue;
          state.data.lessons.push({
            id: makeId('les'),
            studentId: schedule.studentId,
            inquiryId: '',
            sourceScheduleId: schedule.id,
            date,
            startTime: schedule.startTime,
            duration: schedule.duration,
            type: 'Regular',
            status: 'Scheduled',
            rescheduledFromId: '',
            cancellationReason: '',
            location: schedule.location || 'In studio',
            summary: '',
            whatWentWell: '',
            focusNext: '',
            technique: [],
            techniqueNotes: '',
            completedAt: '',
            createdAt: timestamp(),
            updatedAt: timestamp()
          });
          added += 1;
        }
      });
      return added;
    }

    function studentName(studentOrId) {
      const student = typeof studentOrId === 'string' ? state.data.students.find((item) => item.id === studentOrId) : studentOrId;
      if (!student) return 'Unknown student';
      return [student.preferredName || student.firstName, student.lastName].filter(Boolean).join(' ');
    }

    function studentById(id) {
      return state.data.students.find((student) => student.id === id) || null;
    }

    function scheduleForStudent(studentId) {
      return state.data.recurringSchedules.find((schedule) => schedule.studentId === studentId && schedule.active !== false) || null;
    }

    function guardianByContact(email, phone, excludeId = '') {
      const normalizedEmail = String(email || '').trim().toLowerCase();
      const normalizedPhone = normalizePhone(phone);
      return state.data.guardians.find((guardian) => guardian.id !== excludeId && (
        (normalizedEmail && String(guardian.email || '').trim().toLowerCase() === normalizedEmail)
        || (normalizedPhone && normalizePhone(guardian.phone) === normalizedPhone)
      )) || null;
    }

    function guardianLinksForStudent(studentId) {
      return state.data.studentGuardians.filter((link) => link.studentId === studentId).map((link) => ({
        ...link,
        guardian: state.data.guardians.find((guardian) => guardian.id === link.guardianId) || null
      })).filter((link) => link.guardian).sort((a, b) => Number(b.primaryContact) - Number(a.primaryContact) || Number(b.billingContact) - Number(a.billingContact) || `${a.guardian.lastName}${a.guardian.firstName}`.localeCompare(`${b.guardian.lastName}${b.guardian.firstName}`));
    }

    function studentContactSearchText(studentId) {
      const student = studentById(studentId);
      const guardianText = guardianLinksForStudent(studentId).map((link) => [
        link.guardian.firstName,
        link.guardian.lastName,
        link.guardian.email,
        link.guardian.phone,
        normalizePhone(link.guardian.phone),
        link.relationship,
        link.guardian.notes,
        link.notes
      ].join(' ')).join(' ');
      return [studentName(student), student?.email, student?.phone, normalizePhone(student?.phone), guardianText].join(' ').toLowerCase();
    }

    function studentLessons(studentId) {
      return state.data.lessons.filter((lesson) => lesson.studentId === studentId).sort(byDateTime).reverse();
    }

    function studentRepertoire(studentId, currentOnly = false) {
      return state.data.repertoire.filter((item) => item.studentId === studentId && (!currentOnly || item.status !== 'Completed')).sort((a, b) => String(b.lastWorkedOn || b.dateAssigned).localeCompare(String(a.lastWorkedOn || a.dateAssigned)));
    }

    function studentAssignments(studentId) {
      return state.data.assignments.filter((assignment) => assignment.studentId === studentId).sort((a, b) => String(b.dateAssigned).localeCompare(String(a.dateAssigned)));
    }

    function chargePayments(chargeId) {
      return state.data.payments.filter((payment) => payment.chargeId === chargeId && payment.status !== 'Void');
    }

    function chargePaid(charge) {
      return sum(chargePayments(charge.id), (payment) => payment.amount);
    }

    function chargeBalance(charge) {
      if (charge.status === 'Void') return 0;
      return Math.max(0, Number(charge.amount || 0) - chargePaid(charge));
    }

    function chargeStatus(charge) {
      if (charge.status === 'Void') return 'Void';
      const paid = chargePaid(charge);
      const balance = chargeBalance(charge);
      if (balance <= .009) return 'Paid';
      if (paid > 0) return charge.dueDate < localIso() ? 'Overdue' : 'Partial';
      return charge.dueDate < localIso() ? 'Overdue' : 'Open';
    }

    function studentBalance(studentId) {
      return sum(state.data.tuitionCharges.filter((charge) => charge.studentId === studentId && charge.status !== 'Void'), chargeBalance);
    }

    function studentPaymentStatus(studentId) {
      const charges = state.data.tuitionCharges.filter((charge) => charge.studentId === studentId && charge.status !== 'Void');
      if (charges.some((charge) => chargeStatus(charge) === 'Overdue')) return 'Overdue';
      if (charges.some((charge) => chargeStatus(charge) === 'Partial')) return 'Partial';
      return studentBalance(studentId) > .009 ? 'Open' : 'Paid';
    }

    function makeupBalance(studentId) {
      return state.data.makeupCredits.filter((credit) => credit.studentId === studentId && ['Owed', 'Scheduled'].includes(credit.status)).length;
    }

    function inquiryName(lesson) {
      const inquiry = state.data.inquiries.find((item) => item.id === lesson.inquiryId);
      return inquiry?.prospectName || 'Trial student';
    }

    function lessonDisplayName(lesson) {
      if (lesson.studentId) return studentName(lesson.studentId);
      if (lesson.inquiryId) return inquiryName(lesson);
      return lesson.type;
    }

    function repertoireById(id) {
      return state.data.repertoire.find((item) => item.id === id) || null;
    }

    function recitalById(id) {
      return state.data.recitals.find((item) => item.id === id) || null;
    }

    function participantsForRecital(recitalId) {
      return state.data.recitalParticipants.filter((participant) => participant.recitalId === recitalId).sort((a, b) => Number(a.order || 0) - Number(b.order || 0));
    }

    function logActivity(text, type, route) {
      state.data.activity.unshift({ id: makeId('act'), at: timestamp(), text, type, route });
    }

    function statusBadge(value) {
      return `<span class="status ${slug(value)}">${escapeHtml(value)}</span>`;
    }

    function pageHead(eyebrow, title, description, actions = '') {
      return `<header class="page-head"><div><span class="eyebrow">${escapeHtml(eyebrow)}</span><h1>${escapeHtml(title)}</h1><p>${escapeHtml(description)}</p></div><div class="page-actions">${actions}</div></header>`;
    }

    function metricCard(label, value, note, iconName, tone = '') {
      return `<article class="card metric-card ${tone}"><div class="metric-top"><span class="metric-label">${escapeHtml(label)}</span><span class="metric-icon">${icon(iconName)}</span></div><strong class="metric-value">${escapeHtml(value)}</strong><p class="metric-note">${note}</p></article>`;
    }

    function emptyState(title, message, action = '') {
      return `<div class="empty"><span class="empty-icon">${icon('music')}</span><h3>${escapeHtml(title)}</h3><p>${escapeHtml(message)}</p>${action}</div>`;
    }

    function toast(title, detail = '', type = 'success', duration = 3600) {
      const region = $('#toastRegion');
      if (!region) return;
      const item = document.createElement('div');
      item.className = `toast ${type}`;
      item.setAttribute('role', type === 'error' ? 'alert' : 'status');
      item.innerHTML = `<span class="toast-icon">${icon(type === 'error' ? 'alert' : type === 'warning' ? 'clock' : 'check')}</span><span><strong>${escapeHtml(title)}</strong>${detail ? `<span>${escapeHtml(detail)}</span>` : ''}</span>`;
      region.appendChild(item);
      setTimeout(() => item.remove(), duration);
    }

    function setSaveState(mode, label) {
      const element = $('#saveState');
      if (!element) return;
      element.className = `save-state ${mode === 'saved' ? '' : mode}`;
      element.textContent = label || (mode === 'saving' ? 'Saving…' : mode === 'error' ? 'Save failed' : 'Saved');
    }

    function updateStorageMode(ok = true) {
      const sheets = Repository.mode === 'sheets';
      const offline = Repository.mode === 'memory';
      const sheetsFallback = offline && Repository.fallbackReason === 'sheets';
      document.body.classList.toggle('storage-warning', !ok || offline);
      $('#modeTitle').textContent = sheets ? 'Connected to Google Sheets' : offline ? 'Tab-only memory mode' : ok ? 'Interactive demo' : 'Tab-only mode';
      $('#modeCopy').textContent = sheets ? 'Studio records are stored in this spreadsheet.' : sheetsFallback ? 'Sheets was unavailable; changes live only in this tab. Export before closing.' : offline ? 'Browser storage is unavailable; changes live only in this tab. Export before closing.' : ok ? 'Changes save in this browser.' : 'Storage is unavailable—export before closing.';
    }

    async function persist(collections, message = '', detail = '') {
      const safeCollections = unique((collections || COLLECTIONS).filter((collection) => COLLECTIONS.includes(collection) || collection === 'settings'));
      const snapshot = clone(state.data);
      setSaveState('saving');
      state.saveQueue = state.saveQueue.catch(() => null).then(() => Repository.save(snapshot, safeCollections));
      try {
        const result = await state.saveQueue;
        if (Repository.mode === 'sheets' && result?.state) state.data = normalizeData(result.state);
        state.committedData = clone(state.data);
        state.saveError = false;
        setSaveState('saved');
        updateStorageMode(true);
        updateNavigation();
        if (message) toast(message, detail);
        return true;
      } catch (error) {
        if (state.committedData) state.data = normalizeData(clone(state.committedData));
        state.saveError = true;
        setSaveState('error');
        updateStorageMode(false);
        render({ keepScroll: true });
        toast('Could not save this change', error.message || 'Try again in a moment.', 'error', 6000);
        return false;
      }
    }

    function setTheme(preference) {
      const valid = ['light', 'dark', 'system'].includes(preference) ? preference : 'system';
      const dark = valid === 'dark' || (valid === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.themePreference = valid;
      if (Repository.mode !== 'memory') {
        try { localStorage.setItem(THEME_KEY, valid); } catch (error) { /* theme still applies in memory */ }
      }
      if (state.data?.settings) state.data.settings.appearance = { ...(state.data.settings.appearance || {}), theme: valid };
      const themeButton = $('[data-action="cycle-theme"] use');
      if (themeButton) themeButton.setAttribute('href', dark ? '#i-sun' : '#i-moon');
    }

    function cycleTheme() {
      const current = document.documentElement.dataset.themePreference || 'system';
      const next = current === 'system' ? 'light' : current === 'light' ? 'dark' : 'system';
      setTheme(next);
      if (state.data) persist(['settings'], 'Theme updated', next === 'system' ? 'The studio now follows your device.' : `${next[0].toUpperCase()}${next.slice(1)} theme is active.`);
      if (state.view === 'settings') render();
    }

    function getFocusable(root) {
      return $$('button:not([disabled]), a[href], input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])', root).filter((element) => !element.hidden && element.offsetParent !== null);
    }

    function syncOverlayAccess() {
      const modalOpen = $('#modalRoot')?.classList.contains('open');
      const drawerOpen = $('#drawerRoot')?.classList.contains('open');
      const overlayOpen = modalOpen || drawerOpen;
      document.body.classList.toggle('overlay-open', overlayOpen);
      const app = $('.app-shell');
      if (app) app.inert = Boolean(overlayOpen);
      const drawer = $('#drawerRoot .drawer');
      if (drawer) drawer.inert = Boolean(modalOpen);
    }

    function openModal(title, subtitle, body, footer = '', wide = false) {
      state.lastFocus = document.activeElement;
      const root = $('#modalRoot');
      root.innerHTML = `<section class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-head"><div><h2 id="modalTitle">${escapeHtml(title)}</h2>${subtitle ? `<p>${escapeHtml(subtitle)}</p>` : ''}</div><button class="icon-btn" type="button" data-action="close-modal" aria-label="Close dialog">${icon('x')}</button></header><div class="modal-body">${body}</div>${footer ? `<footer class="modal-foot">${footer}</footer>` : ''}</section>`;
      root.classList.add('open');
      syncOverlayAccess();
      requestAnimationFrame(() => getFocusable(root)[0]?.focus());
    }

    function closeModal(restoreFocus = true) {
      const root = $('#modalRoot');
      if (!root?.classList.contains('open')) return;
      if (state.confirmResolve) {
        const resolve = state.confirmResolve;
        state.confirmResolve = null;
        resolve(false);
      }
      root.classList.remove('open');
      root.innerHTML = '';
      syncOverlayAccess();
      if (restoreFocus && state.lastFocus?.isConnected) state.lastFocus.focus();
    }

    function openDrawer(title, body) {
      closeModal(false);
      state.lastFocus = document.activeElement;
      const root = $('#drawerRoot');
      root.innerHTML = `<section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><header class="drawer-head"><h2 id="drawerTitle">${escapeHtml(title)}</h2><button class="icon-btn" type="button" data-action="close-drawer" aria-label="Close details">${icon('x')}</button></header><div class="drawer-body">${body}</div></section>`;
      root.classList.add('open');
      syncOverlayAccess();
      requestAnimationFrame(() => getFocusable(root)[0]?.focus());
    }

    function closeDrawer(restoreFocus = true) {
      const root = $('#drawerRoot');
      if (!root?.classList.contains('open')) return;
      root.classList.remove('open');
      root.innerHTML = '';
      syncOverlayAccess();
      if (restoreFocus && state.lastFocus?.isConnected) state.lastFocus.focus();
    }

    function confirmAction(title, message, confirmLabel = 'Continue', tone = 'danger') {
      return new Promise((resolve) => {
        state.lastFocus = document.activeElement;
        state.confirmResolve = resolve;
        const root = $('#modalRoot');
        root.innerHTML = `<section class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage"><span class="confirm-icon">${icon('alert')}</span><h2 id="confirmTitle">${escapeHtml(title)}</h2><p id="confirmMessage">${escapeHtml(message)}</p><div class="confirm-actions"><button class="btn secondary" type="button" data-action="confirm-no">Cancel</button><button class="btn ${tone}" type="button" data-action="confirm-yes">${escapeHtml(confirmLabel)}</button></div></section>`;
        root.classList.add('open');
        syncOverlayAccess();
        requestAnimationFrame(() => $('[data-action="confirm-no"]', root)?.focus());
      });
    }

    function finishConfirm(value) {
      const resolve = state.confirmResolve;
      state.confirmResolve = null;
      const root = $('#modalRoot');
      root.classList.remove('open');
      root.innerHTML = '';
      syncOverlayAccess();
      if (state.lastFocus?.isConnected) state.lastFocus.focus();
      resolve?.(value);
    }

    function navigationCounts() {
      const today = localIso();
      return {
        students: state.data.students.filter((student) => student.status === 'Active').length,
        lessons: state.data.lessons.filter((lesson) => lesson.date === today && lesson.status === 'Scheduled').length,
        billing: state.data.tuitionCharges.filter((charge) => chargeStatus(charge) === 'Overdue').length,
        inquiries: state.data.inquiries.filter((inquiry) => inquiry.status === 'New Inquiry' || (inquiry.nextFollowUp && inquiry.nextFollowUp <= today && !['Converted', 'Not Moving Forward'].includes(inquiry.status))).length,
        recitals: state.data.recitals.filter((recital) => recital.status !== 'Completed' && recital.date >= today).length
      };
    }

    function updateNavigation() {
      if (!state.data) return;
      const counts = navigationCounts();
      $('#sidebarNav').innerHTML = NAV_GROUPS.map((group) => `<section class="nav-group"><p class="nav-label">${escapeHtml(group.label)}</p><nav class="nav-list">${group.items.map(([view, label, iconName]) => `<button class="nav-item ${state.view === view ? 'active' : ''}" type="button" data-view="${view}" ${state.view === view ? 'aria-current="page"' : ''}>${icon(iconName)}<span>${escapeHtml(label)}</span>${counts[view] ? `<span class="nav-count">${counts[view]}</span>` : ''}</button>`).join('')}</nav></section>`).join('');
      const mobileItems = [
        ['dashboard', 'Home', 'dashboard'],
        ['schedule', 'Schedule', 'calendar'],
        ['students', 'Students', 'students'],
        ['billing', 'Billing', 'billing'],
        ['more', 'More', 'more']
      ];
      $('#mobileNav').innerHTML = mobileItems.map(([view, label, iconName]) => `<button type="button" data-${view === 'more' ? 'action="open-more"' : `view="${view}"`} class="${state.view === view || (view === 'more' && !['dashboard', 'schedule', 'students', 'billing'].includes(state.view)) ? 'active' : ''}" ${state.view === view ? 'aria-current="page"' : ''}>${icon(iconName)}<span>${label}</span></button>`).join('');
      $('#topbarTitle').textContent = VIEW_TITLES[state.view] || 'Harmony House';
      $('#brandName').textContent = (state.data.settings.studioName || 'Harmony House').replace(' Piano Studio', '');
      $('#teacherName').textContent = state.data.settings.ownerName || 'Studio owner';

    function parseRoute() {
      const [view, id] = (location.hash.slice(1) || 'dashboard').split('/');
      state.view = VALID_VIEWS.includes(view) ? view : 'dashboard';
      state.routeId = id || null;
    }

    function navigate(view, id = null) {
      const nextHash = `${view}${id ? `/${id}` : ''}`;
      closeModal(false);
      closeDrawer(false);
      document.body.classList.remove('nav-open');
      if (location.hash.slice(1) === nextHash) {
        parseRoute();
        render();
      } else {
        location.hash = nextHash;
      }
    }

    function renderDashboard() {
      const today = localIso();
      const period = monthKey();
      const activeStudents = state.data.students.filter((student) => student.status === 'Active');
      const todayLessons = state.data.lessons.filter((lesson) => lesson.date === today && !['Student Cancelled', 'Teacher Cancelled', 'No Show', 'Rescheduled'].includes(lesson.status)).sort(byDateTime);
      const monthPayments = state.data.payments.filter((payment) => payment.status !== 'Void' && payment.date.startsWith(period));
      const outstanding = sum(state.data.tuitionCharges, chargeBalance);
      const completedThisMonth = state.data.lessons.filter((lesson) => lesson.date.startsWith(period) && lesson.status === 'Completed').length;
      const overdueStudents = activeStudents.map((student) => ({ student, balance: sum(state.data.tuitionCharges.filter((charge) => charge.studentId === student.id && chargeStatus(charge) === 'Overdue'), chargeBalance) })).filter((item) => item.balance > 0).sort((a, b) => b.balance - a.balance);
      const owedMakeups = state.data.makeupCredits.filter((credit) => credit.status === 'Owed');
      const dueInquiries = state.data.inquiries.filter((inquiry) => inquiry.nextFollowUp && inquiry.nextFollowUp <= today && !['Converted', 'Not Moving Forward'].includes(inquiry.status));
      const currentRecital = [...state.data.recitals].filter((recital) => recital.status !== 'Completed' && recital.date >= today).sort((a, b) => a.date.localeCompare(b.date))[0];
      const notReady = currentRecital ? participantsForRecital(currentRecital.id).filter((participant) => participant.readiness !== 'Performance Ready') : [];
      const attention = [
        ...overdueStudents.slice(0, 3).map((item) => ({ icon: 'dollar', tone: 'danger', title: `${studentName(item.student)} has overdue tuition`, detail: `${money(item.balance)} still outstanding`, action: 'open-student', id: item.student.id, label: 'Review' })),
        ...owedMakeups.slice(0, 2).map((credit) => ({ icon: 'clock', tone: '', title: `${studentName(credit.studentId)} is owed a makeup`, detail: `Created ${relativeDate(credit.createdDate).toLowerCase()}`, action: 'schedule-makeup', id: credit.id, label: 'Schedule' })),
        ...dueInquiries.slice(0, 2).map((inquiry) => ({ icon: 'inbox', tone: 'info', title: `Follow up with ${inquiry.prospectName}`, detail: `${inquiry.status} · due ${relativeDate(inquiry.nextFollowUp).toLowerCase()}`, action: 'open-inquiry', id: inquiry.id, label: 'Open' })),
        ...(notReady.length ? [{ icon: 'recital', tone: '', title: `${plural(notReady.length, 'recital piece')} still in progress`, detail: `${currentRecital.name} is ${relativeDate(currentRecital.date).toLowerCase()}`, action: 'go-recitals', id: currentRecital.id, label: 'Roster' }] : [])
      ].slice(0, 7);
      const upcomingTrial = [...state.data.lessons].filter((lesson) => lesson.type === 'Trial' && lesson.status === 'Scheduled' && lesson.date >= today).sort(byDateTime)[0];
      const nextClosure = [...(state.data.settings.studioClosures || [])].filter((closure) => closure.date >= today).sort((a, b) => a.date.localeCompare(b.date))[0];
      const dayCounts = unique(state.data.recurringSchedules.filter((schedule) => schedule.active !== false).map((schedule) => schedule.day)).map((day) => ({ day, count: state.data.recurringSchedules.filter((schedule) => schedule.active !== false && schedule.day === day).length }));
      const target = Number(state.data.settings.targetWeeklySlots || 28);
      const bookedPct = Math.min(100, Math.round(activeStudents.length / Math.max(1, target) * 100));

      return `
        ${pageHead('Studio overview', `${greeting()}, ${(state.data.settings.ownerName || 'teacher').split(' ')[0]}.`, `${formatDate(today, { weekday: 'long', month: 'long', day: 'numeric' })} · ${plural(todayLessons.length, 'lesson')} on today’s studio plan.`, `<button class="btn secondary" type="button" data-action="new-payment">${icon('billing')}Record payment</button><button class="btn primary" type="button" data-action="new-student">${icon('user-plus')}Add student</button>`)}
        <section class="metric-grid" aria-label="Studio key metrics">
          ${metricCard("Today's lessons", String(todayLessons.length), `${todayLessons.filter((lesson) => lesson.status === 'Completed').length} completed · ${todayLessons.filter((lesson) => lesson.status === 'Scheduled').length} remaining`, 'calendar', 'info')}
          ${metricCard('Active students', String(activeStudents.length), `${bookedPct}% of ${target} desired weekly slots`, 'students')}
          ${metricCard('Monthly revenue', money(sum(monthPayments, (payment) => payment.amount)), `${plural(monthPayments.length, 'payment')} collected in ${monthLabel(period)}`, 'dollar', 'success')}
          ${metricCard('Outstanding tuition', money(outstanding), `${plural(overdueStudents.length, 'student')} currently overdue`, 'alert', outstanding ? 'danger' : 'success')}
        </section>
        <section class="dashboard-grid">
          <div class="stack">
            <article class="card">
              <header class="card-head"><div><h2>Today’s lessons</h2><p>${completedThisMonth} lessons completed this month</p></div><button class="link-btn" type="button" data-view="schedule">Open schedule</button></header>
              <div class="card-body lesson-list">
                ${todayLessons.length ? todayLessons.map((lesson) => {
                  const student = studentById(lesson.studentId);
                  const activePiece = student ? studentRepertoire(student.id, true)[0] : null;
                  return `<div class="lesson-row"><span class="lesson-time">${escapeHtml(formatTime(lesson.startTime))}</span><span class="lesson-copy"><strong>${escapeHtml(lessonDisplayName(lesson))}</strong><span>${lesson.duration} min · ${escapeHtml(lesson.type)}${activePiece ? ` · ${escapeHtml(activePiece.title)}` : ''}</span></span>${statusBadge(lesson.status)}<button class="btn small ${lesson.status === 'Completed' ? 'secondary' : 'primary'}" type="button" data-action="open-lesson" data-id="${escapeAttr(lesson.id)}">${lesson.status === 'Completed' ? 'Review' : 'Open lesson'}</button></div>`;
                }).join('') : emptyState('A clear teaching day', 'No lesson occurrences are scheduled for today.', `<button class="btn primary" type="button" data-action="new-lesson">${icon('plus')}Add lesson</button>`)}
              </div>
            </article>
            <article class="card">
              <header class="card-head"><div><h2>Needs attention</h2><p>Tuition, follow-ups, makeups, and recital readiness</p></div><span class="status ${attention.length ? 'owed' : 'paid'}">${attention.length ? plural(attention.length, 'item') : 'All clear'}</span></header>
              <div class="card-body attention-list">
                ${attention.length ? attention.map((item) => `<div class="attention-row"><span class="attention-icon ${item.tone}">${icon(item.icon)}</span><span class="attention-copy"><strong>${escapeHtml(item.title)}</strong><span>${escapeHtml(item.detail)}</span></span><button class="btn small secondary" type="button" data-action="${item.action}" data-id="${escapeAttr(item.id)}">${escapeHtml(item.label)}</button></div>`).join('') : emptyState('Everything is handled', 'No overdue tuition, open makeups, or follow-ups need attention.')}
              </div>

          </div>
          <aside class="stack">
            <article class="card">

                ${currentRecital ? `<div class="upcoming-event"><span class="event-date">${escapeHtml(relativeDate(currentRecital.date))} · ${escapeHtml(formatTime(currentRecital.time))}</span><h3>${escapeHtml(currentRecital.name)}</h3><p>${escapeHtml(currentRecital.location)} · ${plural(participantsForRecital(currentRecital.id).length, 'performer')}</p><button class="link-btn" type="button" data-action="go-recitals" data-id="${escapeAttr(currentRecital.id)}">Open recital roster →</button></div>` : ''}
                ${upcomingTrial ? `<div class="upcoming-event"><span class="event-date">${escapeHtml(relativeDate(upcomingTrial.date))} · ${escapeHtml(formatTime(upcomingTrial.startTime))}</span><h3>${escapeHtml(inquiryName(upcomingTrial))} trial lesson</h3><p>${upcomingTrial.duration} minutes · ${escapeHtml(upcomingTrial.location)}</p><button class="link-btn" type="button" data-action="open-lesson" data-id="${escapeAttr(upcomingTrial.id)}">Open trial details →</button></div>` : ''}
                ${nextClosure ? `<div class="upcoming-event"><span class="event-date">${escapeHtml(relativeDate(nextClosure.date))}</span><h3>${escapeHtml(nextClosure.name)}</h3><p>${escapeHtml(formatDate(nextClosure.date))}</p></div>` : ''}
              </div>
            </article>
            <article class="card">
              <header class="card-head"><div><h2>Studio capacity</h2><p>${activeStudents.length} of ${target} weekly slots filled</p></div><strong>${bookedPct}%</strong></header>
              <div class="card-body capacity-list">
                ${dayCounts.map((item) => `<div class="capacity-row"><span>${escapeHtml(item.day.slice(0, 3))}</span><span class="progress" aria-label="${item.count} of 5 typical slots"><span style="width:${Math.min(100, item.count / 5 * 100)}%"></span></span><strong>${item.count}</strong></div>`).join('')}
              </div>
              <footer class="card-foot"><button class="link-btn" type="button" data-view="reports">See capacity report →</button></footer>
            </article>
          </aside>
        </section>`;

    function inputField(name, label, value = '', type = 'text', required = false, attrs = '', hint = '') {
      const id = controlId(name);
      return `<div class="field"><label for="${id}">${escapeHtml(label)}${required ? ' <span class="required">*</span>' : ''}</label><input id="${id}" name="${escapeAttr(name)}" type="${escapeAttr(type)}" value="${escapeAttr(value)}" ${required ? 'required' : ''} ${attrs}>${hint ? `<span class="hint">${escapeHtml(hint)}</span>` : ''}</div>`;
    }

    function selectField(name, label, value, options, required = false, attrs = '', hint = '') {
      const id = controlId(name);
      const normalized = options.map((option) => typeof option === 'string' ? { value: option, label: option } : option);
      if (value && !normalized.some((option) => String(option.value) === String(value))) normalized.push({ value, label: value });
      return `<div class="field"><label for="${id}">${escapeHtml(label)}${required ? ' <span class="required">*</span>' : ''}</label><select id="${id}" name="${escapeAttr(name)}" ${required ? 'required' : ''} ${attrs}>${normalized.map((option) => `<option value="${escapeAttr(option.value)}" ${String(option.value) === String(value) ? 'selected' : ''}>${escapeHtml(option.label)}</option>`).join('')}</select>${hint ? `<span class="hint">${escapeHtml(hint)}</span>` : ''}</div>`;
    }

    function textareaField(name, label, value = '', required = false, attrs = '', hint = '') {
      const id = controlId(name);
      return `<div class="field full"><label for="${id}">${escapeHtml(label)}${required ? ' <span class="required">*</span>' : ''}</label><textarea id="${id}" name="${escapeAttr(name)}" ${required ? 'required' : ''} ${attrs}>${escapeHtml(value)}</textarea>${hint ? `<span class="hint">${escapeHtml(hint)}</span>` : ''}</div>`;
    }

    function renderStudents() {
      const query = state.studentQuery.trim().toLowerCase();
      const filtered = [...state.data.students].filter((student) => {
        const schedule = scheduleForStudent(student.id);
        const matchesQuery = !query || studentContactSearchText(student.id).includes(query);
        const matchesStatus = state.studentStatus === 'All' || student.status === state.studentStatus;
        const matchesDay = state.studentDay === 'All' || schedule?.day === state.studentDay;
        const matchesLevel = state.studentLevel === 'All' || student.level === state.studentLevel;
        return matchesQuery && matchesStatus && matchesDay && matchesLevel;
      }).sort((a, b) => {
        if (state.studentSort === 'name-desc') return studentName(b).localeCompare(studentName(a));
        if (state.studentSort === 'lesson-day') {
          const aSchedule = scheduleForStudent(a.id);
          const bSchedule = scheduleForStudent(b.id);
          const aIndex = aSchedule ? DAY_NAMES.indexOf(aSchedule.day) * 1440 + minutesFromTime(aSchedule.startTime) : Number.MAX_SAFE_INTEGER;
          const bIndex = bSchedule ? DAY_NAMES.indexOf(bSchedule.day) * 1440 + minutesFromTime(bSchedule.startTime) : Number.MAX_SAFE_INTEGER;
          return aIndex - bIndex || studentName(a).localeCompare(studentName(b));
        }
        if (state.studentSort === 'balance-desc') return studentBalance(b.id) - studentBalance(a.id) || studentName(a).localeCompare(studentName(b));
        if (state.studentSort === 'start-newest') return String(b.startDate || '').localeCompare(String(a.startDate || '')) || studentName(a).localeCompare(studentName(b));
        return studentName(a).localeCompare(studentName(b));
      });
      const active = state.data.students.filter((student) => student.status === 'Active');
      const adults = active.filter((student) => student.studentType === 'Adult');
      const overdue = active.filter((student) => studentPaymentStatus(student.id) === 'Overdue');
      const withMakeups = active.filter((student) => makeupBalance(student.id) > 0);
      const dayOptions = ['All', ...unique(state.data.recurringSchedules.filter((schedule) => schedule.active !== false).map((schedule) => schedule.day)).sort((a, b) => DAY_NAMES.indexOf(a) - DAY_NAMES.indexOf(b))];

      const tableRows = filtered.map((student) => {
        const schedule = scheduleForStudent(student.id);
        const guardian = guardianLinksForStudent(student.id)[0]?.guardian;
        const payStatus = studentPaymentStatus(student.id);
        return `<tr class="clickable" tabindex="0" data-action="open-student" data-id="${escapeAttr(student.id)}"><td><span class="avatar-name"><span class="avatar">${escapeHtml(initials(studentName(student)))}</span><span><strong>${escapeHtml(studentName(student))}</strong><span>${escapeHtml(student.studentType)}${guardian ? ` · ${escapeHtml(guardian.firstName)} ${escapeHtml(guardian.lastName)}` : ''}</span></span></span></td><td>${escapeHtml(student.level)}</td><td>${schedule ? `${escapeHtml(schedule.day)} · ${escapeHtml(formatTime(schedule.startTime))}` : '<span class="tag">Unscheduled</span>'}</td><td>${schedule?.duration || '—'}${schedule ? ' min' : ''}</td><td>${statusBadge(payStatus)}</td><td>${makeupBalance(student.id) ? `<span class="status owed">${makeupBalance(student.id)} owed</span>` : '<span class="tag">None</span>'}</td><td>${statusBadge(student.status)}</td><td><span class="row-actions"><button class="btn small secondary" type="button" data-action="open-student" data-id="${escapeAttr(student.id)}">Open</button></span></td></tr>`;
      }).join('');
      const cards = filtered.map((student) => {
        const schedule = scheduleForStudent(student.id);
        return `<button class="card student-card" type="button" data-action="open-student" data-id="${escapeAttr(student.id)}"><span class="student-card-top"><span class="avatar-name"><span class="avatar">${escapeHtml(initials(studentName(student)))}</span><span><strong>${escapeHtml(studentName(student))}</strong><span>${escapeHtml(student.level)}</span></span></span>${statusBadge(student.status)}</span><span class="student-card-meta"><span class="mini-stat"><span>Weekly lesson</span><strong>${schedule ? `${escapeHtml(schedule.day)} · ${escapeHtml(formatTime(schedule.startTime))}` : 'Unscheduled'}</strong></span><span class="mini-stat"><span>Tuition</span><strong>${escapeHtml(studentPaymentStatus(student.id))}${studentBalance(student.id) ? ` · ${money(studentBalance(student.id))}` : ''}</strong></span><span class="mini-stat"><span>Current pieces</span><strong>${studentRepertoire(student.id, true).length}</strong></span><span class="mini-stat"><span>Makeups</span><strong>${makeupBalance(student.id)}</strong></span></span></button>`;
      }).join('');

      return `
        ${pageHead('Student relationships', 'Students', 'Every schedule, guardian, lesson note, piece, assignment, and payment stays connected to the student record.', `<button class="btn primary" type="button" data-action="new-student">${icon('user-plus')}Add student</button>`)}
        <section class="metric-grid" aria-label="Student summary">
          ${metricCard('Active students', String(active.length), `${active.length - adults.length} minors · ${adults.length} adults`, 'students')}
          ${metricCard('Tuition current', String(active.length - overdue.length), `${overdue.length} ${overdue.length === 1 ? 'student needs' : 'students need'} billing follow-up`, 'billing', overdue.length ? 'warning' : 'success')}
          ${metricCard('Makeups open', String(withMakeups.length), `${sum(withMakeups, (student) => makeupBalance(student.id))} credits owed or scheduled`, 'clock', withMakeups.length ? 'warning' : '')}
          ${metricCard('Weekly capacity', `${active.length}/${state.data.settings.targetWeeklySlots}`, `${Math.round(active.length / state.data.settings.targetWeeklySlots * 100)}% of desired recurring slots`, 'calendar', 'info')}
        </section>
        <section class="toolbar" aria-label="Student filters">
          <div class="field-inline search">${icon('search')}<label class="sr-only" for="studentSearch">Search students</label><input id="studentSearch" data-filter="student-query" type="search" value="${escapeAttr(state.studentQuery)}" placeholder="Search students or guardians…"></div>
          <div class="field-inline"><label class="sr-only" for="studentStatusFilter">Student status</label><select id="studentStatusFilter" data-filter="student-status">${['All', 'Active', 'Inactive', 'Trial', 'Waitlist'].map((value) => `<option ${value === state.studentStatus ? 'selected' : ''}>${value}</option>`).join('')}</select></div>
          <div class="field-inline"><label class="sr-only" for="studentDayFilter">Lesson day</label><select id="studentDayFilter" data-filter="student-day">${dayOptions.map((value) => `<option ${value === state.studentDay ? 'selected' : ''}>${value}</option>`).join('')}</select></div>
          <div class="field-inline"><label class="sr-only" for="studentLevelFilter">Level</label><select id="studentLevelFilter" data-filter="student-level">${['All', ...LEVELS].map((value) => `<option ${value === state.studentLevel ? 'selected' : ''}>${value}</option>`).join('')}</select></div>
          <div class="field-inline"><label class="sr-only" for="studentSort">Sort students</label><select id="studentSort" data-filter="student-sort">${[
            ['name-asc', 'Name A–Z'],
            ['name-desc', 'Name Z–A'],
            ['lesson-day', 'Lesson day'],
            ['balance-desc', 'Highest balance'],
            ['start-newest', 'Newest start']
          ].map(([value, label]) => `<option value="${value}" ${value === state.studentSort ? 'selected' : ''}>${label}</option>`).join('')}</select></div>
          <span class="toolbar-spacer"></span><span class="tag">${plural(filtered.length, 'student')}</span>
        </section>
        ${filtered.length ? `<div class="table-wrap desktop-student-table"><table class="data-table"><thead><tr><th>Student</th><th>Level</th><th>Recurring slot</th><th>Length</th><th>Payment</th><th>Makeups</th><th>Status</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>${tableRows}</tbody></table></div><div class="student-cards">${cards}</div>` : `<article class="card">${emptyState('No students match', 'Try clearing a filter or add a new student.', `<button class="btn primary" type="button" data-action="new-student">Add student</button>`)}</article>`}`;
    }

    function renderStudentProfile(student) {
      const schedule = scheduleForStudent(student.id);
      const guardians = guardianLinksForStudent(student.id);
      const lessons = studentLessons(student.id);
      const completed = lessons.filter((lesson) => lesson.status === 'Completed');
      const upcoming = lessons.filter((lesson) => lesson.date >= localIso() && lesson.status === 'Scheduled').sort(byDateTime)[0];
      const repertoire = studentRepertoire(student.id);
      const currentPieces = repertoire.filter((item) => item.status !== 'Completed');
      const assignments = studentAssignments(student.id);
      const currentAssignment = assignments.find((assignment) => assignment.status === 'Current') || assignments[0];
      const charges = state.data.tuitionCharges.filter((charge) => charge.studentId === student.id).sort((a, b) => b.period.localeCompare(a.period));
      const payments = state.data.payments.filter((payment) => payment.studentId === student.id).sort((a, b) => b.date.localeCompare(a.date));
      const makeups = state.data.makeupCredits.filter((credit) => credit.studentId === student.id).sort((a, b) => b.createdDate.localeCompare(a.createdDate));
      const lastLesson = completed[0];
      let content = '';

      if (state.studentTab === 'overview') {
        content = `<div class="detail-grid">
          <div class="detail-block"><span class="detail-label">Next lesson</span><p class="detail-value">${upcoming ? `${shortDate(upcoming.date)} at ${formatTime(upcoming.startTime)} · ${upcoming.duration} min` : 'Nothing scheduled'}</p></div>
          <div class="detail-block"><span class="detail-label">Recurring schedule</span><p class="detail-value">${schedule ? `${schedule.day}s at ${formatTime(schedule.startTime)} · ${schedule.duration} min` : 'Unscheduled'}</p></div>
          <div class="detail-block"><span class="detail-label">Level & focus</span><p class="detail-value">${escapeHtml(student.level)} · ${escapeHtml(student.techniqueFocus || 'No technique focus set')}</p></div>
          <div class="detail-block"><span class="detail-label">Tuition & makeup</span><p class="detail-value">${money(student.tuitionAmount)} / month · ${studentPaymentStatus(student.id)} · ${makeupBalance(student.id)} makeup${makeupBalance(student.id) === 1 ? '' : 's'}</p></div>
          <div class="detail-block full"><span class="detail-label">Contact</span><p class="detail-value">${student.studentType === 'Adult' ? `${escapeHtml(student.email || 'No email')} · ${escapeHtml(student.phone || 'No phone')}` : guardians.length ? guardians.map((link) => `${escapeHtml(link.guardian.firstName)} ${escapeHtml(link.guardian.lastName)} (${escapeHtml(link.relationship)}) · ${escapeHtml(link.guardian.email)} · ${escapeHtml(link.guardian.phone)}`).join('\n') : 'No guardian connected'}</p></div>
          <div class="detail-block full"><span class="detail-label">Current repertoire</span><p class="detail-value">${currentPieces.length ? currentPieces.map((item) => `${escapeHtml(item.title)} — ${escapeHtml(item.composer)} · ${escapeHtml(item.status)}`).join('\n') : 'No current repertoire'}</p></div>
          <div class="detail-block full"><span class="detail-label">Latest assignment</span><p class="detail-value">${currentAssignment ? `${escapeHtml(repertoireById(currentAssignment.repertoireId)?.title || 'General practice')}: ${escapeHtml(currentAssignment.section)}\n${escapeHtml(currentAssignment.instructions)}${currentAssignment.targetTempo ? ` · ${escapeHtml(currentAssignment.targetTempo)} BPM` : ''}` : 'No assignment recorded yet.'}</p></div>
          <div class="detail-block full"><span class="detail-label">Last lesson summary</span><p class="detail-value">${lastLesson ? `${formatDate(lastLesson.date)}\n${escapeHtml(lastLesson.summary || lastLesson.focusNext || 'Completed lesson')}` : 'No completed lessons yet.'}</p></div>
        </div>`;
      } else if (state.studentTab === 'lessons') {
