        content = lessons.length ? `<div class="history-list">${lessons.slice(0, 18).map((lesson) => `<button class="history-item" type="button" data-action="open-lesson" data-id="${escapeAttr(lesson.id)}" style="text-align:left"><span class="history-top"><h4>${escapeHtml(shortDate(lesson.date))} · ${escapeHtml(formatTime(lesson.startTime))}</h4>${statusBadge(lesson.status)}</span><p>${escapeHtml(lesson.summary || lesson.cancellationReason || `${lesson.type} lesson · ${lesson.duration} minutes`)}</p></button>`).join('')}</div>` : emptyState('No lesson history', 'This student does not have any lesson occurrences yet.');
      } else if (state.studentTab === 'repertoire') {
        content = repertoire.length ? `<div class="history-list">${repertoire.map((item) => `<button class="history-item" type="button" data-action="edit-repertoire" data-id="${escapeAttr(item.id)}" style="text-align:left"><span class="history-top"><h4>${escapeHtml(item.title)} · ${escapeHtml(item.composer)}</h4>${statusBadge(item.status)}</span><p>Assigned ${escapeHtml(formatDate(item.dateAssigned))}${item.dateCompleted ? ` · completed ${escapeHtml(formatDate(item.dateCompleted))}` : ''}\n${escapeHtml(item.notes || '')}</p></button>`).join('')}</div>` : emptyState('No repertoire', 'Add a piece to begin a permanent repertoire history.');
      } else if (state.studentTab === 'practice') {
        content = assignments.length ? `<div class="history-list">${assignments.map((assignment) => `<article class="history-item"><span class="history-top"><h4>${escapeHtml(repertoireById(assignment.repertoireId)?.title || 'General practice')}</h4><span class="tag">${escapeHtml(formatDate(assignment.dateAssigned))}</span></span><p><strong>${escapeHtml(assignment.section)}</strong>\n${escapeHtml(assignment.instructions)}${assignment.targetTempo ? `\nTarget: ${escapeHtml(assignment.targetTempo)} BPM` : ''}${assignment.practiceGoal ? `\nGoal: ${escapeHtml(assignment.practiceGoal)}` : ''}</p></article>`).join('')}</div>` : emptyState('No assignments', 'Assignments created from completed lessons will appear here.');
      } else if (state.studentTab === 'billing') {
        content = `<div class="detail-grid" style="margin-bottom:12px"><div class="detail-block"><span class="detail-label">Outstanding balance</span><p class="detail-value">${money(studentBalance(student.id))}</p></div><div class="detail-block"><span class="detail-label">Monthly tuition</span><p class="detail-value">${money(student.tuitionAmount)}</p></div></div>${charges.length ? `<div class="history-list">${charges.slice(0, 10).map((charge) => `<article class="history-item"><span class="history-top"><h4>${escapeHtml(monthLabel(charge.period))} tuition</h4>${statusBadge(chargeStatus(charge))}</span><p>${money(charge.amount)} billed · ${money(chargePaid(charge))} paid · ${money(chargeBalance(charge))} open</p></article>`).join('')}</div>` : emptyState('No billing history', 'Add a tuition charge from Billing.')}${payments.length ? `<h3 style="margin:18px 0 9px;font-family:inherit;font-size:12px">Recent payments</h3><div class="history-list">${payments.slice(0, 6).map((payment) => `<article class="history-item"><span class="history-top"><h4>${money(payment.amount, true)} · ${escapeHtml(payment.method)}</h4><span class="tag">${escapeHtml(formatDate(payment.date))}</span></span>${payment.notes ? `<p>${escapeHtml(payment.notes)}</p>` : ''}</article>`).join('')}</div>` : ''}`;
      } else if (state.studentTab === 'guardians') {
        content = `<div class="section-heading"><div><h2>Guardian relationships</h2><p>Contact details can be shared across siblings while relationship details stay specific to this student.</p></div><button class="btn small primary" type="button" data-action="new-guardian" data-student-id="${escapeAttr(student.id)}">${icon('plus')}Add guardian</button></div>
          ${guardians.length ? `<div class="history-list">${guardians.map((link) => `<article class="history-item" data-guardian-link="${escapeAttr(link.id)}"><span class="history-top"><h4>${escapeHtml(link.guardian.firstName)} ${escapeHtml(link.guardian.lastName)}</h4><span class="tags">${link.primaryContact ? '<span class="status current">Primary</span>' : ''}${link.billingContact ? '<span class="tag">Billing</span>' : ''}</span></span><p>${escapeHtml(link.relationship)} · ${escapeHtml(link.guardian.preferredContact || 'Email')}\n${escapeHtml(link.guardian.email || 'No email')} · ${escapeHtml(link.guardian.phone || 'No phone')}${link.notes ? `\nRelationship note: ${escapeHtml(link.notes)}` : ''}${link.guardian.notes ? `\nContact note: ${escapeHtml(link.guardian.notes)}` : ''}</p><span class="row-actions"><button class="btn small secondary" type="button" data-action="edit-guardian" data-id="${escapeAttr(link.id)}">Edit</button><button class="btn small danger" type="button" data-action="unlink-guardian" data-id="${escapeAttr(link.id)}">Unlink</button></span></article>`).join('')}</div>` : emptyState('No guardian connected', 'A minor must have at least one guardian before this profile can be saved.', `<button class="btn primary" type="button" data-action="new-guardian" data-student-id="${escapeAttr(student.id)}">Add guardian</button>`)}`;
      } else if (state.studentTab === 'notes') {
        content = `<div class="detail-grid"><div class="detail-block full"><span class="detail-label">Primary goals</span><p class="detail-value">${escapeHtml(student.goals || 'No goals recorded')}</p></div><div class="detail-block full"><span class="detail-label">Learning notes</span><p class="detail-value">${escapeHtml(student.learningNotes || 'No learning notes recorded')}</p></div><div class="detail-block full"><span class="detail-label">Technique focus</span><p class="detail-value">${escapeHtml(student.techniqueFocus || 'No technique focus recorded')}</p></div><div class="detail-block full"><span class="detail-label">Teacher notes</span><p class="detail-value">${escapeHtml(student.teacherNotes || 'No private notes recorded')}</p></div>${makeups.length ? `<div class="detail-block full"><span class="detail-label">Makeup history</span><p class="detail-value">${makeups.map((credit) => `${formatDate(credit.createdDate)} · ${credit.status} · ${credit.reason}`).join('\n')}</p></div>` : ''}</div>`;
      }

      const tabs = [['overview', 'Overview'], ['lessons', 'Lesson history'], ['repertoire', 'Repertoire'], ['practice', 'Practice'], ['billing', 'Billing'], ...(student.studentType === 'Minor' ? [['guardians', 'Guardians']] : []), ['notes', 'Notes']];
      return `<div class="profile-hero"><span class="avatar">${escapeHtml(initials(studentName(student)))}</span><span><h2>${escapeHtml(studentName(student))}</h2><p>${escapeHtml(student.level)} · ${escapeHtml(student.studentType)} · ${escapeHtml(student.status)}</p></span><div class="profile-actions"><button class="btn small primary" type="button" data-action="add-lesson-note" data-id="${escapeAttr(student.id)}">${icon('note')}Add lesson note</button><button class="btn small secondary" type="button" data-action="new-payment" data-student-id="${escapeAttr(student.id)}">${icon('billing')}Record payment</button><button class="btn small secondary" type="button" data-action="new-repertoire" data-student-id="${escapeAttr(student.id)}">${icon('music')}Add repertoire</button>${student.studentType === 'Minor' ? `<button class="btn small secondary" type="button" data-action="new-guardian" data-student-id="${escapeAttr(student.id)}">${icon('plus')}Add guardian</button>` : ''}<button class="btn small secondary" type="button" data-action="edit-student" data-id="${escapeAttr(student.id)}">${icon('edit')}Edit</button></div></div><div class="tabs" role="tablist" aria-label="Student profile sections">${tabs.map(([key, label]) => `<button type="button" role="tab" data-action="student-tab" data-tab="${key}" class="${state.studentTab === key ? 'active' : ''}" aria-selected="${state.studentTab === key}">${escapeHtml(label)}</button>`).join('')}</div><div class="profile-content">${content}</div>`;
    }

    function showStudentProfile(studentId) {
      const student = studentById(studentId);
      if (!student) {
        toast('Student not found', 'The record may have been archived or removed.', 'error');
        return;
      }
      openDrawer('Student profile', renderStudentProfile(student));
    }

    function scheduleItemsForDate(date) {
      const lessonItems = state.data.lessons.filter((lesson) => lesson.date === date && (state.scheduleType === 'All' || lesson.type === state.scheduleType)).map((lesson) => ({
        id: lesson.id,
        kind: 'lesson',
        type: lesson.type,
        time: lesson.startTime,
        duration: lesson.duration,
        title: lessonDisplayName(lesson),
        subtitle: `${lesson.type} · ${lesson.status}`,
        status: lesson.status,
        action: 'open-lesson'
      }));
      const recitalItems = state.scheduleType === 'All' ? state.data.recitals.filter((recital) => recital.date === date).map((recital) => ({
        id: recital.id,
        kind: 'recital',
        type: 'Recital',
        time: recital.time,
        duration: '',
        title: recital.name,
        subtitle: `${recital.location} · ${recital.status}`,
        status: recital.status,
        action: 'go-recitals'
      })) : [];
      const closureItems = state.scheduleType === 'All' ? (state.data.settings.studioClosures || []).filter((closure) => closure.date === date).map((closure) => ({
        id: closure.id,
        kind: 'closure',
        type: 'Closure',
        time: '',
        duration: '',
        title: closure.name,
        subtitle: 'Studio unavailable',
        status: 'Closed',
        action: 'go-settings'
      })) : [];
      return [...lessonItems, ...recitalItems, ...closureItems].sort((a, b) => String(a.time || '00:00').localeCompare(String(b.time || '00:00')));
    }

    function renderCalendarEvent(item) {
      const tone = item.kind === 'recital' ? 'recital' : item.kind === 'closure' ? 'closure' : item.type === 'Makeup' ? 'makeup' : item.type === 'Trial' ? 'trial' : '';
      return `<button class="calendar-event ${tone}" type="button" data-action="${item.action}" data-id="${escapeAttr(item.id)}"><strong>${item.time ? `${escapeHtml(formatTime(item.time))} · ` : ''}${escapeHtml(item.title)}</strong><span>${escapeHtml(item.subtitle)}${item.duration ? ` · ${item.duration} min` : ''}</span></button>`;
    }

    function renderAgendaDay(date) {
      const items = scheduleItemsForDate(date);
      return `<article class="card agenda-day"><header class="agenda-day-head"><h3>${escapeHtml(formatDate(date, { weekday: 'long', month: 'short', day: 'numeric' }))}</h3>${date === localIso() ? '<span class="status new">Today</span>' : `<span class="tag">${plural(items.length, 'event')}</span>`}</header><div class="agenda-day-body">${items.length ? items.map((item) => `<button class="agenda-item" type="button" data-action="${item.action}" data-id="${escapeAttr(item.id)}"><span class="agenda-time">${item.time ? escapeHtml(formatTime(item.time)) : 'All day'}</span><span class="agenda-copy"><strong>${escapeHtml(item.title)}</strong><span>${escapeHtml(item.subtitle)}${item.duration ? ` · ${item.duration} min` : ''}</span></span>${item.kind === 'lesson' ? statusBadge(item.status) : `<span class="tag">${escapeHtml(item.type)}</span>`}</button>`).join('') : `<div style="padding:13px 0;color:var(--muted);font-size:11px">No studio events.</div>`}</div></article>`;
    }

    function renderSchedule() {
      const weekStart = startOfWeek(state.scheduleCursor);
      const weekDates = Array.from({ length: 7 }, (_, index) => addDays(index, weekStart));
      const weekEnd = weekDates[6];
      const eventCount = sum(weekDates, (date) => scheduleItemsForDate(date).length);
      return `
        ${pageHead('Teaching calendar', 'Schedule', 'Recurring weekly slots create individual lesson occurrences, so a one-time reschedule never changes the permanent schedule.', `<button class="btn primary" type="button" data-action="new-lesson">${icon('plus')}Add lesson</button>`)}
        <section class="toolbar" aria-label="Schedule controls">
          <button class="icon-btn" type="button" data-action="schedule-prev" aria-label="Previous week">${icon('arrow-left')}</button>
          <button class="btn secondary small" type="button" data-action="schedule-today">Today</button>
          <button class="icon-btn" type="button" data-action="schedule-next" aria-label="Next week">${icon('arrow-right')}</button>
          <strong style="font-family:Georgia,serif;font-size:17px">${escapeHtml(formatDate(weekDates[0], { month: 'short', day: 'numeric' }))} – ${escapeHtml(formatDate(weekEnd, { month: 'short', day: 'numeric', year: 'numeric' }))}</strong>
          <span class="toolbar-spacer"></span>
          <div class="field-inline"><label class="sr-only" for="scheduleTypeFilter">Event type</label><select id="scheduleTypeFilter" data-filter="schedule-type">${['All', ...LESSON_TYPES].map((value) => `<option ${value === state.scheduleType ? 'selected' : ''}>${value}</option>`).join('')}</select></div>
          <div class="segmented" aria-label="Schedule view"><button type="button" data-action="schedule-mode" data-mode="week" class="${state.scheduleMode === 'week' ? 'active' : ''}">Week</button><button type="button" data-action="schedule-mode" data-mode="agenda" class="${state.scheduleMode === 'agenda' ? 'active' : ''}">Agenda</button></div>
        </section>
        <p class="scroll-note" style="margin:-7px 0 10px">Agenda view is optimized for a phone. Use Week on a larger screen for the full studio pattern.</p>
        <section class="schedule-shell">
          <div class="week-view ${state.scheduleMode === 'week' ? '' : 'hidden'}" style="overflow-x:auto;overscroll-behavior:contain"><div class="week-grid">${weekDates.map((date) => {
            const items = scheduleItemsForDate(date);
            return `<section class="week-day ${date === localIso() ? 'today' : ''}"><header class="week-day-head"><span>${escapeHtml(formatDate(date, { weekday: 'short' }))}</span><strong>${escapeHtml(formatDate(date, { day: 'numeric' }))}</strong></header><div class="week-events">${items.length ? items.map(renderCalendarEvent).join('') : '<span style="padding:5px;color:var(--muted);font-size:9px;text-align:center">Open</span>'}</div></section>`;
          }).join('')}</div></div>
          <div class="agenda-view ${state.scheduleMode === 'agenda' ? '' : 'hidden'} agenda-days">${weekDates.map(renderAgendaDay).join('')}</div>
        </section>
        <p style="margin-top:12px;color:var(--muted);font-size:10px">${plural(eventCount, 'calendar item')} this week. Recitals and studio closures appear automatically from their own records.</p>`;
    }

    function renderLessons() {
      const today = localIso();
      const period = monthKey();
      const query = state.lessonQuery.trim().toLowerCase();
      const filtered = [...state.data.lessons].filter((lesson) => {
        const matchesQuery = !query || [lessonDisplayName(lesson), lesson.type, lesson.status, lesson.summary, lesson.techniqueNotes].some((value) => String(value || '').toLowerCase().includes(query));
        const matchesStatus = state.lessonStatus === 'All' || lesson.status === state.lessonStatus;
        let matchesRange = true;
        if (state.lessonRange === 'Today') matchesRange = lesson.date === today;
        else if (state.lessonRange === 'Upcoming') matchesRange = lesson.date >= today && lesson.status === 'Scheduled';
        else if (state.lessonRange === 'Recent') matchesRange = lesson.date >= addDays(-30) && lesson.date <= addDays(7);
        return matchesQuery && matchesStatus && matchesRange;
      }).sort(byDateTime).reverse();
      const todayLessons = state.data.lessons.filter((lesson) => lesson.date === today);
      const completedMonth = state.data.lessons.filter((lesson) => lesson.date.startsWith(period) && lesson.status === 'Completed');
      const cancellationsMonth = state.data.lessons.filter((lesson) => lesson.date.startsWith(period) && ['Student Cancelled', 'Teacher Cancelled', 'No Show'].includes(lesson.status));
      const notesMissing = state.data.lessons.filter((lesson) => lesson.status === 'Completed' && !lesson.summary && lesson.date >= addDays(-21));
      const grouped = filtered.reduce((groups, lesson) => {
        (groups[lesson.date] ||= []).push(lesson);
        return groups;
      }, {});

      return `
        ${pageHead('Teaching record', 'Lessons', 'Open any lesson to review context, record repertoire progress and technique, preserve notes, and create the next practice assignment.', `<button class="btn primary" type="button" data-action="new-lesson">${icon('plus')}Add lesson</button>`)}
        <section class="metric-grid">
          ${metricCard('Today', String(todayLessons.length), `${todayLessons.filter((lesson) => lesson.status === 'Scheduled').length} waiting to be taught`, 'clock', 'info')}
          ${metricCard('Completed this month', String(completedMonth.length), `${sum(completedMonth, (lesson) => lesson.duration) / 60} teaching hours recorded`, 'check', 'success')}
          ${metricCard('Cancellations', String(cancellationsMonth.length), 'Student, teacher, and no-show statuses preserved', 'calendar', cancellationsMonth.length ? 'warning' : '')}
          ${metricCard('Notes to finish', String(notesMissing.length), 'Completed lessons missing a summary in the last 21 days', 'note', notesMissing.length ? 'danger' : 'success')}
        </section>
        <section class="toolbar" aria-label="Lesson filters">
          <div class="field-inline search">${icon('search')}<label class="sr-only" for="lessonSearch">Search lessons</label><input id="lessonSearch" type="search" data-filter="lesson-query" value="${escapeAttr(state.lessonQuery)}" placeholder="Search student, notes, or lesson type…"></div>
          <div class="field-inline"><label class="sr-only" for="lessonRangeFilter">Date range</label><select id="lessonRangeFilter" data-filter="lesson-range">${['Recent', 'Today', 'Upcoming', 'All'].map((value) => `<option ${value === state.lessonRange ? 'selected' : ''}>${value}</option>`).join('')}</select></div>
          <div class="field-inline"><label class="sr-only" for="lessonStatusFilter">Lesson status</label><select id="lessonStatusFilter" data-filter="lesson-status">${['All', ...LESSON_STATUSES].map((value) => `<option ${value === state.lessonStatus ? 'selected' : ''}>${value}</option>`).join('')}</select></div>
          <span class="toolbar-spacer"></span><span class="tag">${plural(filtered.length, 'lesson')}</span>
        </section>
        ${filtered.length ? `<div class="agenda-days">${Object.keys(grouped).sort().reverse().map((date) => `<article class="card agenda-day"><header class="agenda-day-head"><h3>${escapeHtml(formatDate(date, { weekday: 'long', month: 'short', day: 'numeric', year: date.slice(0, 4) !== today.slice(0, 4) ? 'numeric' : undefined }))}</h3><span class="tag">${plural(grouped[date].length, 'lesson')}</span></header><div class="agenda-day-body">${grouped[date].sort(byDateTime).map((lesson) => `<button class="agenda-item" type="button" data-action="open-lesson" data-id="${escapeAttr(lesson.id)}"><span class="agenda-time">${escapeHtml(formatTime(lesson.startTime))}</span><span class="agenda-copy"><strong>${escapeHtml(lessonDisplayName(lesson))}</strong><span>${escapeHtml(lesson.type)} · ${lesson.duration} min${lesson.summary ? ` · ${escapeHtml(lesson.summary)}` : ''}</span></span>${statusBadge(lesson.status)}</button>`).join('')}</div></article>`).join('')}</div>` : `<article class="card">${emptyState('No lessons match', 'Adjust the date or status filter, or add a lesson occurrence.', `<button class="btn primary" type="button" data-action="new-lesson">Add lesson</button>`)}</article>`}`;
    }

    function renderStageTrack(currentStage) {
      const currentIndex = REPERTOIRE_STAGES.indexOf(currentStage);
      return `<div class="stage-track" aria-label="Repertoire progress">${REPERTOIRE_STAGES.map((stage, index) => `<span class="stage-step ${index <= currentIndex ? 'reached' : ''}">${escapeHtml(stage)}</span>`).join('')}</div>`;
    }

    function renderRepertoire() {
      const query = state.repertoireQuery.trim().toLowerCase();
      const filtered = [...state.data.repertoire].filter((item) => {
        const student = studentById(item.studentId);
        const matchesQuery = !query || [item.title, item.composer, item.collection, item.notes, studentName(student)].some((value) => String(value || '').toLowerCase().includes(query));
        const matchesStatus = state.repertoireStatus === 'All' || (state.repertoireStatus === 'Current' ? item.status !== 'Completed' : item.status === 'Completed');
        return matchesQuery && matchesStatus;
      }).sort((a, b) => {
        if (a.status === 'Completed' && b.status !== 'Completed') return 1;
        if (a.status !== 'Completed' && b.status === 'Completed') return -1;
        return studentName(a.studentId).localeCompare(studentName(b.studentId));
      });
      const current = state.data.repertoire.filter((item) => item.status !== 'Completed');
      const ready = current.filter((item) => item.status === 'Performance Ready');
      const polishing = current.filter((item) => item.status === 'Polishing');
      const completedThisYear = state.data.repertoire.filter((item) => item.status === 'Completed' && item.dateCompleted?.startsWith(String(new Date().getFullYear())));
      const rows = filtered.map((item) => {
        const stageIndex = REPERTOIRE_STAGES.indexOf(item.status);
        const nextStage = REPERTOIRE_STAGES[Math.min(REPERTOIRE_STAGES.length - 1, stageIndex + 1)];
        return `<tr><td><strong>${escapeHtml(item.title)}</strong><br><span style="color:var(--muted);font-size:10px">${escapeHtml(item.composer)}</span></td><td><button class="link-btn" type="button" data-action="open-student" data-id="${escapeAttr(item.studentId)}">${escapeHtml(studentName(item.studentId))}</button></td><td>${statusBadge(item.status)}</td><td>${escapeHtml(formatDate(item.dateAssigned))}</td><td>${escapeHtml(relativeDate(item.lastWorkedOn || item.dateAssigned))}</td><td style="max-width:250px;color:var(--muted);font-size:11px">${escapeHtml(item.notes || '—')}</td><td><span class="row-actions"><button class="btn small secondary" type="button" data-action="edit-repertoire" data-id="${escapeAttr(item.id)}">Edit</button>${item.status !== 'Completed' ? `<button class="btn small primary" type="button" data-action="advance-repertoire" data-id="${escapeAttr(item.id)}">Move to ${escapeHtml(nextStage)}</button>` : ''}</span></td></tr>`;
      }).join('');
      return `
        ${pageHead('Musical progress', 'Repertoire', 'Track every piece from first assignment through performance readiness and a permanent completed history.', `<button class="btn primary" type="button" data-action="new-repertoire">${icon('plus')}Assign piece</button>`)}
        <section class="metric-grid">
          ${metricCard('Current pieces', String(current.length), `${(current.length / Math.max(1, state.data.students.filter((student) => student.status === 'Active').length)).toFixed(1)} per active student`, 'music')}
          ${metricCard('Polishing', String(polishing.length), 'Pieces in the final refinement stage', 'lessons', 'warning')}
          ${metricCard('Performance ready', String(ready.length), `${Math.round(ready.length / Math.max(1, current.length) * 100)}% of current repertoire`, 'recital', 'success')}
          ${metricCard('Completed this year', String(completedThisYear.length), 'Historical repertoire stays searchable', 'check', 'info')}
        </section>
        <section class="toolbar">
          <div class="field-inline search">${icon('search')}<label class="sr-only" for="repertoireSearch">Search repertoire</label><input id="repertoireSearch" type="search" data-filter="repertoire-query" value="${escapeAttr(state.repertoireQuery)}" placeholder="Search piece, composer, or student…"></div>
          <div class="segmented" aria-label="Repertoire status"><button type="button" data-action="repertoire-status" data-status="Current" class="${state.repertoireStatus === 'Current' ? 'active' : ''}">Current</button><button type="button" data-action="repertoire-status" data-status="Completed" class="${state.repertoireStatus === 'Completed' ? 'active' : ''}">Completed</button><button type="button" data-action="repertoire-status" data-status="All" class="${state.repertoireStatus === 'All' ? 'active' : ''}">All</button></div>
          <span class="toolbar-spacer"></span><span class="tag">${plural(filtered.length, 'piece')}</span>
        </section>
        ${filtered.length ? `<div class="table-wrap"><table class="data-table" style="min-width:1050px"><thead><tr><th>Piece</th><th>Student</th><th>Stage</th><th>Assigned</th><th>Last worked</th><th>Notes</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>${rows}</tbody></table></div>` : `<article class="card">${emptyState('No repertoire matches', 'Try a different search or status, or assign a new piece.', `<button class="btn primary" type="button" data-action="new-repertoire">Assign piece</button>`)}</article>`}`;
    }

    function renderBilling() {
      const period = state.billingPeriod;
      const query = state.billingQuery.trim().toLowerCase();
      const charges = state.data.tuitionCharges.filter((charge) => charge.status !== 'Void' && charge.period === period).sort((a, b) => studentName(a.studentId).localeCompare(studentName(b.studentId)));
      const periodPayments = state.data.payments.filter((payment) => payment.status !== 'Void' && payment.date.startsWith(period)).sort((a, b) => b.date.localeCompare(a.date));
      const filteredCharges = charges.filter((charge) => !query || [studentContactSearchText(charge.studentId), charge.description, charge.notes, charge.period, charge.dueDate, chargeStatus(charge)].some((value) => String(value || '').toLowerCase().includes(query)));
      const filteredPayments = periodPayments.filter((payment) => {
        const charge = state.data.tuitionCharges.find((item) => item.id === payment.chargeId);
        return !query || [studentContactSearchText(payment.studentId), payment.method, payment.notes, payment.date, charge?.description].some((value) => String(value || '').toLowerCase().includes(query));
      });
      const billed = sum(charges, (charge) => charge.amount);
      const collected = sum(periodPayments, (payment) => payment.amount);
      const outstanding = sum(charges, chargeBalance);
      const overdue = charges.filter((charge) => chargeStatus(charge) === 'Overdue');
      const openMakeups = state.data.makeupCredits.filter((credit) => ['Owed', 'Scheduled'].includes(credit.status));
      const periodOptions = unique(state.data.tuitionCharges.map((charge) => charge.period)).sort().reverse();
      let body = '';
      if (state.billingTab === 'charges') {
        body = filteredCharges.length ? `<div class="table-wrap"><table class="data-table" style="min-width:900px"><thead><tr><th>Student</th><th>Description</th><th>Due</th><th class="num">Billed</th><th class="num">Paid</th><th class="num">Balance</th><th>Status</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>${filteredCharges.map((charge) => `<tr><td><button class="link-btn" type="button" data-action="open-student" data-id="${escapeAttr(charge.studentId)}">${escapeHtml(studentName(charge.studentId))}</button></td><td>${escapeHtml(charge.description)}</td><td>${escapeHtml(formatDate(charge.dueDate))}</td><td class="num">${money(charge.amount, true)}</td><td class="num">${money(chargePaid(charge), true)}</td><td class="num"><strong>${money(chargeBalance(charge), true)}</strong></td><td>${statusBadge(chargeStatus(charge))}</td><td><span class="row-actions">${chargeBalance(charge) > 0 ? `<button class="btn small primary" type="button" data-action="new-payment" data-charge-id="${escapeAttr(charge.id)}">Record payment</button>` : '<span class="tag">Settled</span>'}</span></td></tr>`).join('')}</tbody></table></div>` : `<article class="card">${emptyState(query ? 'No charges match' : 'No charges for this month', query ? 'Try another student, guardian contact, description, or status.' : 'Generate monthly tuition or add a one-time charge.', query ? '' : `<button class="btn primary" type="button" data-action="generate-tuition">Generate tuition</button>`)}</article>`;
      } else if (state.billingTab === 'payments') {
        body = filteredPayments.length ? `<div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Student</th><th>Charge</th><th>Method</th><th class="num">Amount</th><th>Notes</th></tr></thead><tbody>${filteredPayments.map((payment) => {
          const charge = state.data.tuitionCharges.find((item) => item.id === payment.chargeId);
          return `<tr><td>${escapeHtml(formatDate(payment.date))}</td><td><button class="link-btn" type="button" data-action="open-student" data-id="${escapeAttr(payment.studentId)}">${escapeHtml(studentName(payment.studentId))}</button></td><td>${escapeHtml(charge?.description || 'Unapplied payment')}</td><td>${escapeHtml(payment.method)}</td><td class="num"><strong>${money(payment.amount, true)}</strong></td><td>${escapeHtml(payment.notes || '—')}</td></tr>`;
        }).join('')}</tbody></table></div>` : `<article class="card">${emptyState(query ? 'No payments match' : 'No payments this month', query ? 'Try another student, guardian contact, method, charge, or note.' : 'Record a payment to create a permanent transaction history.', query ? '' : `<button class="btn primary" type="button" data-action="new-payment">Record payment</button>`)}</article>`;
      } else {
        const credits = [...state.data.makeupCredits].filter((credit) => {
          const source = state.data.lessons.find((lesson) => lesson.id === credit.lessonId);
          const scheduled = state.data.lessons.find((lesson) => lesson.id === credit.scheduledLessonId);
          return !query || [studentContactSearchText(credit.studentId), credit.reason, credit.status, credit.notes, credit.createdDate, source?.cancellationReason, scheduled?.date].some((value) => String(value || '').toLowerCase().includes(query));
        }).sort((a, b) => {
          const order = ['Owed', 'Scheduled', 'Completed', 'Waived', 'Expired'];
          return order.indexOf(a.status) - order.indexOf(b.status) || b.createdDate.localeCompare(a.createdDate);
        });
        body = credits.length ? `<div class="table-wrap"><table class="data-table" style="min-width:880px"><thead><tr><th>Student</th><th>Created</th><th>Reason</th><th>Status</th><th>Related lesson</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>${credits.map((credit) => {
          const source = state.data.lessons.find((lesson) => lesson.id === credit.lessonId);
          const scheduled = state.data.lessons.find((lesson) => lesson.id === credit.scheduledLessonId);
          return `<tr><td><button class="link-btn" type="button" data-action="open-student" data-id="${escapeAttr(credit.studentId)}">${escapeHtml(studentName(credit.studentId))}</button></td><td>${escapeHtml(formatDate(credit.createdDate))}</td><td>${escapeHtml(credit.reason)}</td><td>${statusBadge(credit.status)}</td><td>${source ? `${escapeHtml(formatDate(source.date))} cancellation` : 'Manual credit'}${scheduled ? `<br><span style="color:var(--muted);font-size:10px">Makeup: ${escapeHtml(formatDate(scheduled.date))}</span>` : ''}</td><td><span class="row-actions">${credit.status === 'Owed' ? `<button class="btn small primary" type="button" data-action="schedule-makeup" data-id="${escapeAttr(credit.id)}">Schedule</button><button class="btn small secondary" type="button" data-action="waive-makeup" data-id="${escapeAttr(credit.id)}">Waive</button>` : credit.status === 'Scheduled' && scheduled ? `<button class="btn small secondary" type="button" data-action="open-lesson" data-id="${escapeAttr(scheduled.id)}">Open lesson</button>` : '<span class="tag">History</span>'}</span></td></tr>`;
        }).join('')}</tbody></table></div>` : `<article class="card">${emptyState('No makeup credits', 'Eligible cancellations and manual credits will appear here.')}</article>`;
      }
      return `
        ${pageHead('Tuition ledger', 'Billing', 'Charges and payment transactions remain separate so every balance can be reconciled without overwriting history.', `<button class="btn secondary" type="button" data-action="new-charge">${icon('plus')}Add charge</button><button class="btn primary" type="button" data-action="new-payment">${icon('billing')}Record payment</button>`)}
        <section class="metric-grid">
          ${metricCard('Billed', money(billed), `${plural(charges.length, 'charge')} in ${monthLabel(period)}`, 'note')}
          ${metricCard('Collected', money(collected), `${billed ? Math.round(collected / billed * 100) : 0}% of this month’s billed tuition`, 'dollar', 'success')}
          ${metricCard('Outstanding', money(outstanding), `${plural(overdue.length, 'charge')} overdue in this period`, 'alert', outstanding ? 'danger' : 'success')}
          ${metricCard('Makeups open', String(openMakeups.length), `${openMakeups.filter((credit) => credit.status === 'Owed').length} still need a date`, 'clock', openMakeups.length ? 'warning' : '')}
        </section>
        <section class="toolbar">
          <div class="segmented" aria-label="Billing section"><button type="button" data-action="billing-tab" data-tab="charges" class="${state.billingTab === 'charges' ? 'active' : ''}">Charges</button><button type="button" data-action="billing-tab" data-tab="payments" class="${state.billingTab === 'payments' ? 'active' : ''}">Payments</button><button type="button" data-action="billing-tab" data-tab="makeups" class="${state.billingTab === 'makeups' ? 'active' : ''}">Makeups</button></div>
          <div class="field-inline search">${icon('search')}<label class="sr-only" for="billingSearch">Search billing</label><input id="billingSearch" type="search" data-filter="billing-query" value="${escapeAttr(state.billingQuery)}" placeholder="Search student, guardian, charge, or note…"></div>
          <span class="toolbar-spacer"></span>
          ${state.billingTab !== 'makeups' ? `<div class="field-inline"><label class="sr-only" for="billingPeriod">Billing month</label><select id="billingPeriod" data-filter="billing-period">${periodOptions.map((value) => `<option value="${value}" ${value === period ? 'selected' : ''}>${escapeHtml(monthLabel(value))}</option>`).join('')}</select></div>` : ''}
          ${state.billingTab === 'charges' ? `<button class="btn secondary small" type="button" data-action="generate-tuition">${icon('refresh')}Generate tuition</button>` : ''}
        </section>
        ${body}`;
    }

    function renderInquiries() {
      const today = localIso();
      const query = state.inquiryQuery.trim().toLowerCase();
      const activeInquiries = state.data.inquiries.filter((inquiry) => !['Converted', 'Not Moving Forward'].includes(inquiry.status)).filter((inquiry) => !query || [inquiry.prospectName, inquiry.guardianName, inquiry.email, inquiry.phone, inquiry.experience, inquiry.availability, inquiry.source].some((value) => String(value || '').toLowerCase().includes(query)));
      const newCount = state.data.inquiries.filter((inquiry) => inquiry.status === 'New Inquiry').length;
      const trials = state.data.inquiries.filter((inquiry) => ['Trial Scheduled', 'Trial Completed'].includes(inquiry.status)).length;
      const followups = state.data.inquiries.filter((inquiry) => inquiry.nextFollowUp && inquiry.nextFollowUp <= today && !['Converted', 'Not Moving Forward'].includes(inquiry.status)).length;
      const converted = state.data.inquiries.filter((inquiry) => inquiry.status === 'Converted').length;
      const closed = state.data.inquiries.filter((inquiry) => ['Converted', 'Not Moving Forward'].includes(inquiry.status));

      return `
        ${pageHead('Prospective students', 'Inquiries', 'Move each family from first contact through a trial and enrollment without re-entering their information.', `<button class="btn secondary" type="button" data-action="show-closed-inquiries">Closed (${closed.length})</button><button class="btn primary" type="button" data-action="new-inquiry">${icon('plus')}Add inquiry</button>`)}
        <section class="metric-grid">
          ${metricCard('New inquiries', String(newCount), 'Waiting for a personal response', 'inbox', newCount ? 'info' : '')}
          ${metricCard('Trials in motion', String(trials), 'Scheduled or ready for follow-up', 'calendar', 'warning')}
          ${metricCard('Follow-ups due', String(followups), 'Next actions due today or earlier', 'clock', followups ? 'danger' : 'success')}
          ${metricCard('Converted', String(converted), 'Lead details preserved after enrollment', 'students', 'success')}
        </section>
        <section class="toolbar">
          <div class="field-inline search">${icon('search')}<label class="sr-only" for="inquirySearch">Search inquiries</label><input id="inquirySearch" type="search" data-filter="inquiry-query" value="${escapeAttr(state.inquiryQuery)}" placeholder="Search prospect, parent, availability…"></div>
          <span class="toolbar-spacer"></span><span class="tag">${plural(activeInquiries.length, 'active inquiry', 'active inquiries')}</span>
        </section>
        <div class="pipeline" aria-label="Inquiry pipeline">
          ${INQUIRY_STAGES.map((stage) => {
            const items = activeInquiries.filter((inquiry) => inquiry.status === stage);
            return `<section class="pipeline-column"><header class="pipeline-head"><strong>${escapeHtml(stage)}</strong><span>${items.length}</span></header><div class="pipeline-body">${items.length ? items.map((inquiry) => `<button class="lead-card" type="button" data-action="open-inquiry" data-id="${escapeAttr(inquiry.id)}"><h3>${escapeHtml(inquiry.prospectName)}</h3><p>${inquiry.age ? `Age ${inquiry.age} · ` : ''}${escapeHtml(inquiry.experience || 'Experience not set')}</p><p>${escapeHtml(inquiry.availability || 'Availability not set')}</p><div class="tags"><span class="tag">${escapeHtml(inquiry.source || 'Unknown source')}</span>${inquiry.nextFollowUp ? `<span class="tag">${escapeHtml(relativeDate(inquiry.nextFollowUp))}</span>` : ''}</div></button>`).join('') : `<div style="padding:11px;color:var(--muted);font-size:10px;text-align:center">No inquiries</div>`}</div></section>`;
          }).join('')}
        </div>`;
    }

    function renderInquiryDetail(inquiry) {
      const stageIndex = INQUIRY_ALL_STAGES.indexOf(inquiry.status);
      const nextStage = INQUIRY_ALL_STAGES[Math.min(INQUIRY_ALL_STAGES.length - 1, stageIndex + 1)];
      const trial = state.data.lessons.find((lesson) => lesson.id === inquiry.trialLessonId);
      const converted = inquiry.convertedStudentId ? studentById(inquiry.convertedStudentId) : null;
      let primaryAction = '';
      if (inquiry.status === 'New Inquiry') primaryAction = `<button class="btn primary" type="button" data-action="advance-inquiry" data-id="${escapeAttr(inquiry.id)}" data-status="Contacted">Mark contacted</button>`;
      else if (inquiry.status === 'Contacted') primaryAction = `<button class="btn primary" type="button" data-action="schedule-trial" data-id="${escapeAttr(inquiry.id)}">Schedule trial</button>`;
      else if (inquiry.status === 'Trial Scheduled' && trial) primaryAction = `<button class="btn primary" type="button" data-action="open-lesson" data-id="${escapeAttr(trial.id)}">Open trial lesson</button>`;
      else if (['Trial Completed', 'Enrolling'].includes(inquiry.status)) primaryAction = `<button class="btn primary" type="button" data-action="convert-inquiry" data-id="${escapeAttr(inquiry.id)}">Convert to student</button>`;
      else if (inquiry.status === 'Waitlist') primaryAction = `<button class="btn primary" type="button" data-action="advance-inquiry" data-id="${escapeAttr(inquiry.id)}" data-status="Contacted">Reopen conversation</button>`;
      else if (converted) primaryAction = `<button class="btn primary" type="button" data-action="open-student" data-id="${escapeAttr(converted.id)}">Open student profile</button>`;
      return `<div class="profile-hero"><span class="avatar">${escapeHtml(initials(inquiry.prospectName))}</span><span><h2>${escapeHtml(inquiry.prospectName)}</h2><p>${escapeHtml(inquiry.status)} · received ${escapeHtml(relativeDate(inquiry.dateReceived).toLowerCase())}</p></span><div class="profile-actions">${primaryAction}${inquiry.status !== 'Converted' ? `<button class="btn small secondary" type="button" data-action="edit-inquiry" data-id="${escapeAttr(inquiry.id)}">${icon('edit')}Edit inquiry</button>` : ''}${!['Converted', 'Not Moving Forward'].includes(inquiry.status) ? `<button class="btn small secondary" type="button" data-action="follow-up-inquiry" data-id="${escapeAttr(inquiry.id)}">${icon('clock')}Set follow-up</button>` : ''}</div></div><div class="profile-content"><div class="detail-grid">
        <div class="detail-block"><span class="detail-label">Prospect</span><p class="detail-value">${inquiry.age ? `Age ${inquiry.age}` : 'Age not provided'} · ${escapeHtml(inquiry.experience || 'Experience not provided')}</p></div>
        <div class="detail-block"><span class="detail-label">Source</span><p class="detail-value">${escapeHtml(inquiry.source || 'Not provided')}</p></div>
        <div class="detail-block full"><span class="detail-label">Contact</span><p class="detail-value">${inquiry.guardianName ? `${escapeHtml(inquiry.guardianName)}\n` : ''}${escapeHtml(inquiry.email || 'No email')} · ${escapeHtml(inquiry.phone || 'No phone')}</p></div>
        <div class="detail-block full"><span class="detail-label">Desired availability</span><p class="detail-value">${escapeHtml(inquiry.availability || 'Not provided')}</p></div>
        <div class="detail-block"><span class="detail-label">Next follow-up</span><p class="detail-value">${inquiry.nextFollowUp ? `${formatDate(inquiry.nextFollowUp)} · ${relativeDate(inquiry.nextFollowUp)}` : 'No follow-up scheduled'}</p></div>
        <div class="detail-block"><span class="detail-label">Trial lesson</span><p class="detail-value">${trial ? `${formatDate(trial.date)} at ${formatTime(trial.startTime)} · ${trial.status}` : 'Not scheduled'}</p></div>
        <div class="detail-block full"><span class="detail-label">Notes</span><p class="detail-value">${escapeHtml(inquiry.notes || 'No notes')}</p></div>
      </div>${nextStage && !['Converted', 'Not Moving Forward'].includes(inquiry.status) ? `<div style="margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--paper-soft);font-size:11px;color:var(--muted)">Typical next stage: <strong style="color:var(--ink)">${escapeHtml(nextStage)}</strong>. Use the contextual action above when the workflow is ready.</div>` : ''}</div>`;
    }

    function showInquiryDetail(inquiryId) {
      const inquiry = state.data.inquiries.find((item) => item.id === inquiryId);
      if (!inquiry) return toast('Inquiry not found', '', 'error');
      openDrawer('Inquiry details', renderInquiryDetail(inquiry));
    }

    function renderRecitals() {
      const sortedRecitals = [...state.data.recitals].sort((a, b) => b.date.localeCompare(a.date));
      if (!state.selectedRecitalId || !recitalById(state.selectedRecitalId)) {
        state.selectedRecitalId = sortedRecitals.find((recital) => recital.status !== 'Completed')?.id || sortedRecitals[0]?.id || null;
      }
      const recital = recitalById(state.selectedRecitalId);
      const participants = recital ? participantsForRecital(recital.id) : [];
      const ready = participants.filter((participant) => participant.readiness === 'Performance Ready').length;
      const recitalLocked = recital?.status === 'Completed';
      const programRows = participants.map((participant, index) => {
        const student = studentById(participant.studentId);
        const piece = repertoireById(participant.repertoireId);
        const displayStudent = recitalLocked ? (participant.studentNameSnapshot || studentName(student)) : studentName(student);
        const displayTitle = recitalLocked ? (participant.pieceTitleSnapshot || piece?.title || 'Piece not selected') : (piece?.title || 'Piece not selected');
        const displayComposer = recitalLocked ? (participant.composerSnapshot || piece?.composer || '') : (piece?.composer || '');
        return `<tr><td><span class="program-order">${participant.order}</span></td><td><button class="link-btn" type="button" data-action="open-student" data-id="${escapeAttr(participant.studentId)}">${escapeHtml(displayStudent)}</button></td><td><strong>${escapeHtml(displayTitle)}</strong><br><span style="color:var(--muted);font-size:10px">${escapeHtml(displayComposer)}</span></td><td><label class="sr-only" for="readiness-${participant.id}">Readiness for ${escapeAttr(displayStudent)}</label><select id="readiness-${escapeAttr(participant.id)}" data-recital-readiness="${escapeAttr(participant.id)}" style="min-height:38px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--paper-soft)" ${recitalLocked ? 'disabled' : ''}>${['Learning', 'Developing', 'Polishing', 'Performance Ready'].map((value) => `<option ${value === participant.readiness ? 'selected' : ''}>${value}</option>`).join('')}</select></td><td>${escapeHtml(participant.notes || '—')}</td><td>${recitalLocked ? '<span class="tag">Final program</span>' : `<span class="row-actions"><button class="icon-btn" style="width:34px;min-width:34px;height:34px" type="button" data-action="move-participant" data-id="${escapeAttr(participant.id)}" data-direction="-1" aria-label="Move ${escapeAttr(displayStudent)} earlier" ${index === 0 ? 'disabled' : ''}>${icon('chevron-up')}</button><button class="icon-btn" style="width:34px;min-width:34px;height:34px" type="button" data-action="move-participant" data-id="${escapeAttr(participant.id)}" data-direction="1" aria-label="Move ${escapeAttr(displayStudent)} later" ${index === participants.length - 1 ? 'disabled' : ''}>${icon('chevron-down')}</button></span>`}</td></tr>`;
      }).join('');

      return `
        ${pageHead('Performance planning', 'Recitals', 'Build the program from each student’s existing repertoire, track readiness, and preserve completed recital history.', `<button class="btn primary" type="button" data-action="new-recital">${icon('plus')}New recital</button>`)}
        <section class="recital-layout">
          <aside class="card"><header class="card-head"><div><h2>Studio recitals</h2><p>${plural(sortedRecitals.length, 'event')}</p></div></header><div class="recital-list">${sortedRecitals.map((item) => `<button class="recital-select ${item.id === state.selectedRecitalId ? 'active' : ''}" type="button" data-action="select-recital" data-id="${escapeAttr(item.id)}"><strong>${escapeHtml(item.name)}</strong><span>${escapeHtml(formatDate(item.date))} · ${escapeHtml(item.status)}</span></button>`).join('')}</div></aside>
          ${recital ? `<div class="stack">
            <article class="card card-pad"><div class="section-title"><div><span class="eyebrow">${escapeHtml(recital.status)}</span><h2>${escapeHtml(recital.name)}</h2><p>${escapeHtml(formatDate(recital.date, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }))} at ${escapeHtml(formatTime(recital.time))} · ${escapeHtml(recital.location)}</p></div><div class="page-actions">${recitalLocked ? '' : `<button class="btn small secondary" type="button" data-action="edit-recital" data-id="${escapeAttr(recital.id)}">${icon('edit')}Edit</button>`}<button class="btn small secondary" type="button" data-action="preview-program" data-id="${escapeAttr(recital.id)}">Program preview</button></div></div><div class="progress" aria-label="${ready} of ${participants.length} performers ready"><span style="width:${participants.length ? ready / participants.length * 100 : 0}%"></span></div><p style="margin-top:7px;color:var(--muted);font-size:10px">${ready} of ${participants.length} performers marked Performance Ready${recitalLocked ? ' · final program is read-only' : ''}</p></article>
            <article class="card"><header class="card-head"><div><h2>Program roster</h2><p>${recitalLocked ? 'Final performance history' : 'Order controls update the saved performance sequence'}</p></div>${recitalLocked ? '<span class="status completed">Read-only</span>' : `<button class="btn small primary" type="button" data-action="add-participant" data-recital-id="${escapeAttr(recital.id)}">${icon('plus')}Add performer</button>`}</header>${participants.length ? `<div class="table-wrap" style="border:0;border-radius:0;box-shadow:none"><table class="data-table" style="min-width:920px"><thead><tr><th>Order</th><th>Student</th><th>Piece</th><th>Readiness</th><th>Notes</th><th><span class="sr-only">Reorder</span></th></tr></thead><tbody>${programRows}</tbody></table></div>` : emptyState('No performers recorded', recitalLocked ? 'This completed recital has no saved performers.' : 'Add students using repertoire already tracked in their profiles.', recitalLocked ? '' : `<button class="btn primary" type="button" data-action="add-participant" data-recital-id="${escapeAttr(recital.id)}">Add performer</button>`)}</article>
            ${recital.status !== 'Completed' ? `<div style="display:flex;justify-content:flex-end"><button class="btn secondary" type="button" data-action="complete-recital" data-id="${escapeAttr(recital.id)}">${icon('check')}Mark recital complete</button></div>` : ''}
          </div>` : `<article class="card">${emptyState('No recitals yet', 'Create the next studio recital and begin building the program.', `<button class="btn primary" type="button" data-action="new-recital">New recital</button>`)}</article>`}
        </section>`;
    }

    function renderExpenses() {
      const query = state.expenseQuery.trim().toLowerCase();
      const filtered = [...state.data.expenses].filter((expense) => {
        const matchesQuery = !query || [expense.vendor, expense.category, expense.description, expense.notes].some((value) => String(value || '').toLowerCase().includes(query));
        const matchesCategory = state.expenseCategory === 'All' || expense.category === state.expenseCategory;
        return matchesQuery && matchesCategory;
      }).sort((a, b) => b.date.localeCompare(a.date));
      const currentMonth = state.data.expenses.filter((expense) => expense.date.startsWith(monthKey()));
      const currentYear = String(new Date().getFullYear());
      const yearExpenses = state.data.expenses.filter((expense) => expense.date.startsWith(currentYear));
      const largestCategory = [...EXPENSE_CATEGORIES].map((category) => ({ category, amount: sum(yearExpenses.filter((expense) => expense.category === category), (expense) => expense.amount) })).sort((a, b) => b.amount - a.amount)[0];
      const avgMonthly = sum(state.data.expenses, (expense) => expense.amount) / Math.max(1, unique(state.data.expenses.map((expense) => expense.date.slice(0, 7))).length);
      return `
        ${pageHead('Business spending', 'Expenses', 'Keep lightweight studio expenses searchable and connected to the same owner-operator business snapshot.', `<button class="btn secondary" type="button" data-action="export-expenses">${icon('download')}Export CSV</button><button class="btn primary" type="button" data-action="new-expense">${icon('plus')}Add expense</button>`)}
        <section class="metric-grid">
          ${metricCard('This month', money(sum(currentMonth, (expense) => expense.amount)), `${plural(currentMonth.length, 'expense')} recorded`, 'expense', 'warning')}
          ${metricCard('Year to date', money(sum(yearExpenses, (expense) => expense.amount)), `${plural(yearExpenses.length, 'transaction')}`, 'dollar')}
          ${metricCard('Largest category', largestCategory?.category || 'None', largestCategory ? `${money(largestCategory.amount)} this year` : 'No expenses recorded', 'reports', 'info')}
          ${metricCard('Monthly average', money(avgMonthly), 'Across months with recorded spending', 'calendar', 'success')}
        </section>
        <section class="toolbar">
          <div class="field-inline search">${icon('search')}<label class="sr-only" for="expenseSearch">Search expenses</label><input id="expenseSearch" type="search" data-filter="expense-query" value="${escapeAttr(state.expenseQuery)}" placeholder="Search vendor or description…"></div>
          <div class="field-inline"><label class="sr-only" for="expenseCategoryFilter">Expense category</label><select id="expenseCategoryFilter" data-filter="expense-category">${['All', ...EXPENSE_CATEGORIES].map((value) => `<option ${value === state.expenseCategory ? 'selected' : ''}>${escapeHtml(value)}</option>`).join('')}</select></div>
          <span class="toolbar-spacer"></span><span class="tag">${plural(filtered.length, 'expense')}</span>
        </section>
        ${filtered.length ? `<div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Vendor</th><th>Category</th><th>Description</th><th class="num">Amount</th><th>Notes</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>${filtered.map((expense) => `<tr><td>${escapeHtml(formatDate(expense.date))}</td><td><strong>${escapeHtml(expense.vendor)}</strong></td><td><span class="tag">${escapeHtml(expense.category)}</span></td><td>${escapeHtml(expense.description)}</td><td class="num"><strong>${money(expense.amount, true)}</strong></td><td>${escapeHtml(expense.notes || '—')}</td><td><span class="row-actions"><button class="btn small secondary" type="button" data-action="edit-expense" data-id="${escapeAttr(expense.id)}">Edit</button><button class="btn small danger" type="button" data-action="delete-expense" data-id="${escapeAttr(expense.id)}">Delete</button></span></td></tr>`).join('')}</tbody></table></div>` : `<article class="card">${emptyState('No expenses match', 'Try a different filter or record a new studio expense.', `<button class="btn primary" type="button" data-action="new-expense">Add expense</button>`)}</article>`}`;
    }

    function reportMonths(count) {
      return Array.from({ length: count }, (_, index) => monthKey(index - count + 1));
    }

    function renderReports() {
      const months = reportMonths(state.reportRange);
      const revenue = months.map((period) => ({
        period,
        billed: sum(state.data.tuitionCharges.filter((charge) => charge.status !== 'Void' && charge.period === period), (charge) => charge.amount),
        collected: sum(state.data.payments.filter((payment) => payment.status !== 'Void' && payment.date.startsWith(period)), (payment) => payment.amount),
        expenses: sum(state.data.expenses.filter((expense) => expense.date.startsWith(period)), (expense) => expense.amount)
      }));
      const maxRevenue = Math.max(1, ...revenue.flatMap((item) => [item.billed, item.collected]));
      const rangeStart = `${months[0]}-01`;
      const rangeLessons = state.data.lessons.filter((lesson) => lesson.date >= rangeStart && lesson.date <= `${months.at(-1)}-31`);
      const activeStudents = state.data.students.filter((student) => student.status === 'Active');
      const levelCounts = LEVELS.map((level) => ({ label: level, value: activeStudents.filter((student) => student.level === level).length })).filter((item) => item.value);
      const maxLevel = Math.max(1, ...levelCounts.map((item) => item.value));
      const lessonStatuses = ['Completed', 'Student Cancelled', 'Teacher Cancelled', 'No Show'].map((status) => ({ label: status, value: rangeLessons.filter((lesson) => lesson.status === status).length }));
      const maxLesson = Math.max(1, ...lessonStatuses.map((item) => item.value));
      const leadCounts = ['New Inquiry', 'Contacted', 'Trial Scheduled', 'Trial Completed', 'Enrolling', 'Converted'].map((status) => ({ label: status.replace(' Inquiry', ''), value: state.data.inquiries.filter((inquiry) => inquiry.status === status).length }));
      const maxLead = Math.max(1, ...leadCounts.map((item) => item.value));
      const totalCollected = sum(revenue, (item) => item.collected);
      const totalExpenses = sum(revenue, (item) => item.expenses);
      const net = totalCollected - totalExpenses;
      const completed = rangeLessons.filter((lesson) => lesson.status === 'Completed').length;
      const cancelled = rangeLessons.filter((lesson) => ['Student Cancelled', 'Teacher Cancelled', 'No Show'].includes(lesson.status)).length;
      const avgRevenue = activeStudents.length ? totalCollected / activeStudents.length / state.reportRange : 0;
      const capacity = Math.round(activeStudents.length / Math.max(1, state.data.settings.targetWeeklySlots) * 100);
      const dayCounts = unique(state.data.recurringSchedules.filter((schedule) => schedule.active !== false).map((schedule) => schedule.day)).map((day) => ({ label: day, value: state.data.recurringSchedules.filter((schedule) => schedule.active !== false && schedule.day === day).length }));
      const maxDay = Math.max(1, ...dayCounts.map((item) => item.value));
      return `
        ${pageHead('Owner insights', 'Reports', 'A practical studio-health snapshot built from actual students, lesson occurrences, charges, payments, inquiries, and expenses.', `<div class="segmented" aria-label="Report range"><button type="button" data-action="report-range" data-range="3" class="${state.reportRange === 3 ? 'active' : ''}">3 months</button><button type="button" data-action="report-range" data-range="6" class="${state.reportRange === 6 ? 'active' : ''}">6 months</button><button type="button" data-action="report-range" data-range="12" class="${state.reportRange === 12 ? 'active' : ''}">12 months</button></div>`)}
        <section class="metric-grid">
          ${metricCard('Revenue collected', money(totalCollected), `${monthLabel(months[0])} through ${monthLabel(months.at(-1))}`, 'dollar', 'success')}
          ${metricCard('Operating expenses', money(totalExpenses), 'Business snapshot, not tax accounting', 'expense', 'warning')}
          ${metricCard('Net snapshot', money(net), `${totalCollected ? Math.round(net / totalCollected * 100) : 0}% after recorded expenses`, 'reports', net >= 0 ? 'success' : 'danger')}
          ${metricCard('Avg. monthly / student', money(avgRevenue), `${activeStudents.length} active students`, 'students', 'info')}
        </section>
        <section class="grid two">
          <article class="card chart-card"><header class="card-head"><div><h2>Billed vs. collected</h2><p>Monthly tuition ledger</p></div></header><div class="chart-body"><div class="bar-chart">${revenue.map((item) => `<div class="bar-group"><span class="bar" title="${escapeAttr(monthLabel(item.period))} billed ${money(item.billed)}" style="height:${Math.max(2, item.billed / maxRevenue * 100)}%"></span><span class="bar alt" title="${escapeAttr(monthLabel(item.period))} collected ${money(item.collected)}" style="height:${Math.max(2, item.collected / maxRevenue * 100)}%"></span><span class="bar-label">${escapeHtml(formatDate(`${item.period}-01`, { month: 'short' }))}</span></div>`).join('')}</div><div class="chart-legend"><span class="legend-key">Billed</span><span class="legend-key alt">Collected</span></div></div></article>
          <article class="card chart-card"><header class="card-head"><div><h2>Students by level</h2><p>Current active enrollment</p></div></header><div class="chart-body horizontal-chart">${levelCounts.map((item) => `<div class="horizontal-bar"><span>${escapeHtml(item.label)}</span><span class="track"><span class="fill" style="width:${item.value / maxLevel * 100}%"></span></span><strong>${item.value}</strong></div>`).join('')}</div></article>
          <article class="card chart-card"><header class="card-head"><div><h2>Teaching workload</h2><p>${completed} completed · ${cancelled} cancellations / no-shows</p></div></header><div class="chart-body horizontal-chart">${lessonStatuses.map((item) => `<div class="horizontal-bar"><span>${escapeHtml(item.label)}</span><span class="track"><span class="fill" style="width:${item.value / maxLesson * 100}%;background:${item.label === 'Completed' ? 'var(--success)' : item.label === 'No Show' ? 'var(--danger)' : 'var(--warning)'}"></span></span><strong>${item.value}</strong></div>`).join('')}</div></article>
          <article class="card chart-card"><header class="card-head"><div><h2>Inquiry funnel</h2><p>Current and historical lead stages</p></div></header><div class="chart-body horizontal-chart">${leadCounts.map((item) => `<div class="horizontal-bar"><span>${escapeHtml(item.label)}</span><span class="track"><span class="fill" style="width:${item.value / maxLead * 100}%;background:var(--info)"></span></span><strong>${item.value}</strong></div>`).join('')}</div></article>
          <article class="card chart-card"><header class="card-head"><div><h2>Studio capacity</h2><p>${capacity}% of ${state.data.settings.targetWeeklySlots} desired weekly slots</p></div></header><div class="chart-body horizontal-chart">${dayCounts.map((item) => `<div class="horizontal-bar"><span>${escapeHtml(item.label)}</span><span class="track"><span class="fill" style="width:${item.value / maxDay * 100}%;background:var(--accent)"></span></span><strong>${item.value}</strong></div>`).join('')}</div></article>
          <article class="card chart-card"><header class="card-head"><div><h2>Studio snapshot</h2><p>Key owner-operator context</p></div></header><div class="chart-body"><div class="detail-grid"><div class="detail-block"><span class="detail-label">Active students</span><p class="detail-value">${activeStudents.length}</p></div><div class="detail-block"><span class="detail-label">Retention view</span><p class="detail-value">${state.data.students.length ? Math.round(activeStudents.length / state.data.students.length * 100) : 0}% active in demo records</p></div><div class="detail-block"><span class="detail-label">Open makeups</span><p class="detail-value">${state.data.makeupCredits.filter((credit) => ['Owed', 'Scheduled'].includes(credit.status)).length}</p></div><div class="detail-block"><span class="detail-label">Current repertoire</span><p class="detail-value">${state.data.repertoire.filter((item) => item.status !== 'Completed').length} pieces</p></div><div class="detail-block full"><span class="detail-label">Accounting note</span><p class="detail-value">This is an operating snapshot from recorded tuition, payments, and expenses. It is not a formal tax or accounting report.</p></div></div></div></article>
        </section>`;
    }

    function renderSettings() {
      const settings = state.data.settings;
      const sections = [['studio', 'Studio'], ['teaching', 'Teaching'], ['policy', 'Policies'], ['appearance', 'Appearance & data']];
      let content = '';
      if (state.settingsSection === 'studio') {
        content = `<article class="card card-pad"><form data-form="settings-studio"><div class="form-grid">${inputField('studioName', 'Studio name', settings.studioName, 'text', true)}${inputField('ownerName', 'Teacher / owner name', settings.ownerName, 'text', true)}${inputField('email', 'Studio email', settings.email, 'email', true)}${inputField('phone', 'Studio phone', settings.phone, 'tel')}${inputField('address', 'Studio address', settings.address, 'text', true)}${selectField('timezone', 'Timezone', settings.timezone, ['America/Chicago', 'America/New_York', 'America/Denver', 'America/Los_Angeles'], true)}<div class="field full"><button class="btn primary" type="submit">${icon('check')}Save studio profile</button></div></div></form></article>`;
      } else if (state.settingsSection === 'teaching') {
        content = `<article class="card card-pad"><form data-form="settings-teaching"><div class="form-grid">${inputField('targetWeeklySlots', 'Desired weekly capacity', settings.targetWeeklySlots, 'number', true, 'min="1" max="80" step="1"')}${inputField('defaultTuition', 'Default monthly tuition', settings.defaultTuition, 'number', true, 'min="1" step="1"')}${inputField('openTime', 'Teaching day starts', settings.openTime, 'time', true)}${inputField('closeTime', 'Teaching day ends', settings.closeTime, 'time', true)}<div class="field full"><span class="group-label">Teaching days</span><div class="check-grid">${DAY_NAMES.map((day) => `<label class="check-option"><input type="checkbox" name="teachingDays" value="${day}" ${settings.teachingDays.includes(day) ? 'checked' : ''}>${day}</label>`).join('')}</div></div><div class="field full"><button class="btn primary" type="submit">${icon('check')}Save teaching defaults</button></div></div></form></article>`;
      } else if (state.settingsSection === 'policy') {
        content = `<article class="card card-pad"><form data-form="settings-policy"><div class="form-grid">${textareaField('cancellationPolicy', 'Cancellation and makeup policy', settings.cancellationPolicy, true, 'rows="6"', 'This text is a studio reference; credits remain manually controlled.')}<div class="field full"><button class="btn primary" type="submit">${icon('check')}Save policy</button></div></div></form></article><article class="card" style="margin-top:16px"><header class="card-head"><div><h2>Studio closures</h2><p>Closures appear automatically on the schedule</p></div><button class="btn small primary" type="button" data-action="add-closure">${icon('plus')}Add closure</button></header><div class="card-body">${settings.studioClosures.length ? settings.studioClosures.sort((a, b) => a.date.localeCompare(b.date)).map((closure) => `<div class="attention-row"><span class="attention-icon danger">${icon('calendar')}</span><span class="attention-copy"><strong>${escapeHtml(closure.name)}</strong><span>${escapeHtml(formatDate(closure.date))} · ${escapeHtml(relativeDate(closure.date))}</span></span><button class="btn small danger" type="button" data-action="delete-closure" data-id="${escapeAttr(closure.id)}">Remove</button></div>`).join('') : emptyState('No closures', 'Add teacher travel, holidays, or studio-unavailable days.')}</div></article>`;
      } else {
        const preference = document.documentElement.dataset.themePreference || settings.appearance?.theme || 'system';
        content = `<section class="grid two"><article class="card card-pad"><span class="eyebrow">Theme</span><h2 style="margin-top:6px;font-size:25px">Comfortable in every light.</h2><p style="margin-top:7px;color:var(--muted)">Choose a theme or let Harmony House follow this device.</p><div class="segmented" style="margin-top:16px">${['light', 'dark', 'system'].map((theme) => `<button type="button" data-action="set-theme" data-theme="${theme}" class="${preference === theme ? 'active' : ''}">${theme[0].toUpperCase()}${theme.slice(1)}</button>`).join('')}</div></article><article class="card card-pad"><span class="eyebrow">Demo data</span><h2 style="margin-top:6px;font-size:25px">${Repository.mode === 'sheets' ? 'Spreadsheet-backed records.' : 'Saved on this device.'}</h2><p style="margin-top:7px;color:var(--muted)">${Repository.mode === 'sheets' ? 'All app-owned tabs can be exported or explicitly reset to the original sample studio.' : 'Export a backup any time. Reset affects only the Harmony House demo key, never unrelated browser data.'}</p><div class="page-actions" style="margin-top:16px;justify-content:flex-start"><button class="btn secondary" type="button" data-action="export-data">${icon('download')}Export JSON</button><button class="btn danger" type="button" data-action="reset-data">${icon('refresh')}Reset sample data</button></div></article></section><article class="card card-pad" style="margin-top:16px"><span class="eyebrow">Storage model</span><h2 style="margin-top:6px;font-size:25px">Human-readable, connected records.</h2><p style="margin-top:7px;color:var(--muted)">The portfolio demo uses one namespaced browser record. The Apps Script edition uses separate Students, Guardians, Schedules, Lessons, Repertoire, Assignments, Charges, Payments, Makeups, Inquiries, Recitals, Participants, Expenses, Activity, and Settings tabs in Google Sheets.</p></article>`;
      }
      return `${pageHead('Studio configuration', 'Settings', 'Keep the few studio defaults that genuinely affect daily teaching and business workflows.')}<section class="toolbar"><div class="segmented" style="overflow-x:auto">${sections.map(([key, label]) => `<button type="button" data-action="settings-section" data-section="${key}" class="${state.settingsSection === key ? 'active' : ''}">${escapeHtml(label)}</button>`).join('')}</div></section>${content}`;
    }

    function formValues(form) {
      return Object.fromEntries(new FormData(form).entries());
    }

    function requireTrimmed(form, names) {
      let valid = true;
      names.forEach((name) => {
        const field = form.elements[name];
        if (!field) return;
        const empty = !String(field.value || '').trim();
        field.setCustomValidity(empty ? 'Please enter a value.' : '');
        if (empty) valid = false;
      });
      if (!valid) form.reportValidity();
      return valid;
    }

    function positiveNumber(value) {
      const parsed = Number(value);
      return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
    }

    function openStudentModal(studentId = null, defaults = {}) {
      fieldCounter = 0;
      const student = studentId ? studentById(studentId) : null;
      const schedule = student ? scheduleForStudent(student.id) : null;
      const guardianLink = student ? guardianLinksForStudent(student.id)[0] : null;
      const guardian = guardianLink?.guardian || {};
      const value = { status: 'Active', studentType: defaults.age && Number(defaults.age) >= 18 ? 'Adult' : 'Minor', startDate: localIso(), level: 'Beginner', yearsStudying: 0, tuitionAmount: state.data.settings.defaultTuition, preferredContact: 'Email', billingModel: 'Monthly tuition', location: 'In studio', ...defaults, ...(student || {}) };
      const suggestedDay = schedule?.day || defaults.scheduleDay || state.data.settings.teachingDays[0];
      const suggestedDuration = schedule?.duration || defaults.duration || 45;
      const suggestedTime = schedule?.startTime || defaults.scheduleTime || firstAvailableRecurringTime(suggestedDay, suggestedDuration, student?.id || '');
      const body = `<form id="studentForm" data-form="student">
        <input type="hidden" name="id" value="${escapeAttr(student?.id || '')}">
        <div class="form-section"><h3>Student identity</h3><div class="form-grid">
          ${inputField('firstName', 'First name', value.firstName, 'text', true)}
